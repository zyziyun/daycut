  <div data-hf-id="hf-stqh" id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="633.65">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const CUES = [{"s": 0.4, "e": 2.66, "en": "Here's a strange fact.", "zh": "一个奇怪的事实："}, {"s": 2.7, "e": 4.95, "en": "A language model with 70 billion parameters", "zh": "一个有 700 亿参数的语言模型，"}, {"s": 4.99, "e": 8.96, "en": "needs about 140 gigabytes of memory, just to sit there.", "zh": "光是放着就需要大约 140GB 内存。"}, {"s": 9, "e": 11.42, "en": "A good graphics card has 24.", "zh": "而一块好显卡只有 24GB。"}, {"s": 11.46, "e": 14.48, "en": "And yet, people run models like this on laptops.", "zh": "可人们却能在笔记本上运行这样的模型。"}, {"s": 14.52, "e": 16.98, "en": "The trick is called quantization.", "zh": "这个技巧叫做\"量化\"。"}, {"s": 17.02, "e": 21.46, "en": "And at its heart, it's something you learned in primary school. Rounding.", "zh": "它的核心，是你小学就学过的东西——四舍五入。"}, {"s": 21.5, "e": 25.32, "en": "Before any math, notice that you round things all the time.", "zh": "先不谈数学。你其实一直在四舍五入："}, {"s": 25.36, "e": 29.07, "en": "A price of $3.99 is basically $4.", "zh": "3.99 元基本就是 4 元；"}, {"s": 29.11, "e": 32.27, "en": "A drive of 52.7 kilometres is about 50.", "zh": "52.7 公里大约就是 50 公里。"}, {"s": 32.31, "e": 36.06, "en": "You lose a little detail, and you keep the meaning.", "zh": "丢掉一点细节，意思却保留了。"}, {"s": 36.1, "e": 41.13, "en": "Computers do this too. A smooth colour gradient can use millions of shades.", "zh": "计算机也这样做：一段平滑的渐变可以有几百万种颜色，"}, {"s": 41.17, "e": 44.34, "en": "Squeeze it down to just 16, and you see a few steps,", "zh": "压缩到只剩 16 种，你会看到几道台阶，"}, {"s": 44.38, "e": 49.22, "en": "but it's clearly the same picture. Rougher, yes, and much, much smaller.", "zh": "但显然还是同一张图。更粗糙，但小得多。"}, {"s": 49.26, "e": 54.71, "en": "Quantization does exactly this, to the numbers inside an AI model.", "zh": "量化做的就是这件事——对象是 AI 模型里的数字。"}, {"s": 54.75, "e": 57.11, "en": "So, what numbers are we talking about?", "zh": "那么，是哪些数字？"}, {"s": 57.15, "e": 60.92, "en": "Underneath, a neural network is a giant pile of numbers called weights.", "zh": "神经网络的底层，是一大堆叫做\"权重\"的数字。"}, {"s": 60.96, "e": 65.12, "en": "Each one is a decimal, like 0.31, or −1.2.", "zh": "每个都是小数，比如 0.31 或 −1.2。"}, {"s": 65.16, "e": 71.07, "en": "When the model thinks, it mostly multiplies its inputs by these weights and adds them up.", "zh": "模型\"思考\"时，主要就是把输入乘以权重再加起来，"}, {"s": 71.11, "e": 72.57, "en": "Billions of times.", "zh": "重复几十亿次。"}, {"s": 72.61, "e": 78.61, "en": "So the size of a model is simply the number of weights, times the space each one takes.", "zh": "所以模型大小 = 权重个数 × 每个权重占的空间。"}, {"s": 78.65, "e": 82.8, "en": "And space is measured in bits. Think of a bit as a light switch.", "zh": "空间用\"比特\"衡量。把一个比特想象成电灯开关："}, {"s": 82.84, "e": 87.92, "en": "One switch has 2 positions, off or on, so it can name 2 different values.", "zh": "一个开关有开、关两种状态，能表示 2 个不同的值。"}, {"s": 87.96, "e": 92.94, "en": "Add a second switch, and you get 4 combinations. 3 switches, 8.", "zh": "再加一个开关，有 4 种组合；三个开关，8 种。"}, {"s": 92.98, "e": 95.77, "en": "Every new switch doubles the count.", "zh": "每多一个开关，数量翻倍。"}, {"s": 95.81, "e": 99.36, "en": "So with b bits, you can name 2ᵇ different values.", "zh": "所以 b 个比特能表示 2ᵇ 个不同的值。"}, {"s": 99.4, "e": 103.5, "en": "4 bits gives 16. 8 bits, 256.", "zh": "4 位是 16，8 位是 256，"}, {"s": 103.54, "e": 106.44, "en": "16 bits, about 65,000.", "zh": "16 位大约 65000。"}, {"s": 106.48, "e": 111.91, "en": "Keep this doubling in mind. Every bit you remove halves your choices.", "zh": "记住这个翻倍规律：每去掉一位，可选的值少一半。"}, {"s": 111.95, "e": 116.56, "en": "The standard way to store a weight, called FP32, uses 32 bits:", "zh": "存储权重的标准格式叫 FP32，用 32 位："}, {"s": 116.6, "e": 121.98, "en": "one for the sign, 8 for the size, and 23 for the fine detail.", "zh": "1 位符号、8 位表示大小、23 位表示精细部分。"}, {"s": 122.02, "e": 124.36, "en": "That's far more precision than a model really needs.", "zh": "这比模型真正需要的精度多得多。"}, {"s": 124.4, "e": 130.2, "en": "FP16 uses half as many bits, and it's what most models ship in today.", "zh": "FP16 只用一半位数，也是如今大多数模型发布时的格式。"}, {"s": 130.24, "e": 135.06, "en": "But what if we went further, and stored each weight as a small whole number?", "zh": "但如果更进一步，把每个权重存成一个小整数呢？"}, {"s": 135.1, "e": 139.86, "en": "INT8 uses 8 bits, so 256 possible values.", "zh": "INT8 用 8 位，有 256 种取值；"}, {"s": 139.9, "e": 142.76, "en": "INT4 uses 4 bits, just 16.", "zh": "INT4 用 4 位，只有 16 种。"}, {"s": 142.8, "e": 148.36, "en": "70 billion weights at 4 bits each is about 35 gigabytes. Suddenly, it fits.", "zh": "700 亿个权重 × 4 位 ≈ 35GB。一下子就装得下了。"}, {"s": 148.4, "e": 150.24, "en": "So here's the core idea.", "zh": "核心思想是这样的："}, {"s": 150.28, "e": 155.43, "en": "Picture all your weights as dots on a number line. They can sit anywhere.", "zh": "把所有权重想象成数轴上的点，它们可以落在任何位置。"}, {"s": 155.47, "e": 159.1, "en": "Now lay down a ruler with only a few tick marks,", "zh": "现在放一把只有少数刻度的尺子，"}, {"s": 159.14, "e": 162.56, "en": "say 16, evenly spaced across the range.", "zh": "比如 16 个刻度，均匀分布在整个范围上。"}, {"s": 162.6, "e": 166.32, "en": "Quantization means snapping every dot to its nearest tick.", "zh": "量化就是：把每个点\"吸\"到离它最近的刻度上。"}, {"s": 166.36, "e": 171.07, "en": "Instead of storing the exact value, you store which tick it landed on,", "zh": "我们不再存精确值，只存它落在第几个刻度——"}, {"s": 171.11, "e": 173.68, "en": "a small integer from zero to 15.", "zh": "一个 0 到 15 的小整数。"}, {"s": 173.72, "e": 177.74, "en": "That's it. That's the whole principle.", "zh": "就这么简单，这就是全部原理。"}, {"s": 177.78, "e": 181.76, "en": "Everything else is about choosing the ruler well.", "zh": "剩下的一切，都是在研究怎么把尺子选好。"}, {"s": 181.8, "e": 185.39, "en": "Let's do one by hand. Here are 6 weights.", "zh": "我们手算一遍。这里有 6 个权重，"}, {"s": 185.43, "e": 188.32, "en": "The smallest is −1, the largest is 2.", "zh": "最小是 −1，最大是 2。"}, {"s": 188.36, "e": 192.59, "en": "We have 4 bits, so 16 ticks, numbered 0 to 15.", "zh": "我们有 4 位，所以 16 个刻度，编号 0 到 15。"}, {"s": 192.63, "e": 196.54, "en": "Between the first tick and the last, there are 15 gaps.", "zh": "第一个刻度和最后一个之间有 15 个间隔。"}, {"s": 196.58, "e": 199.84, "en": "The full range is 2 − (−1), which is 3.", "zh": "整个范围是 2 −（−1）= 3。"}, {"s": 199.88, "e": 204.06, "en": "3, shared across 15 gaps, gives a step of 0.2.", "zh": "3 分成 15 份，每一步是 0.2。"}, {"s": 204.1, "e": 207.6, "en": "That step is called the scale, written s.", "zh": "这一步的大小叫做\"缩放因子\" s。"}, {"s": 207.64, "e": 213.26, "en": "It answers one question: how much real value does one integer step stand for?", "zh": "它回答的是：整数每走一步，代表多少真实数值？"}, {"s": 213.3, "e": 215.34, "en": "Next, where does 0 go?", "zh": "接下来，零放在哪里？"}, {"s": 215.38, "e": 220.0, "en": "Our ruler starts at −1, so real 0 sits 5 steps up.", "zh": "尺子从 −1 开始，所以真实的 0 在往上 5 步的位置。"}, {"s": 220.04, "e": 226.04, "en": "−1, divided by 0.2, is −5. Flip the sign, and you get 5.", "zh": "−1 ÷ 0.2 = −5，取反得 5。"}, {"s": 226.08, "e": 228.68, "en": "That number is the zero-point, z.", "zh": "这个数叫\"零点\" z，"}, {"s": 228.72, "e": 232.39, "en": "It's the integer that stands for the real value 0.", "zh": "它是代表真实数值 0 的那个整数。"}, {"s": 232.43, "e": 236.31, "en": "Keeping 0 exact matters, because networks are full of zeros,", "zh": "让 0 保持精确很重要，因为网络里到处都是 0，"}, {"s": 236.35, "e": 240.41, "en": "and we never want nothing to quietly turn into something.", "zh": "我们不希望\"没有\"悄悄变成\"有\"。"}, {"s": 240.45, "e": 244.6, "en": "Now the recipe. To quantize a weight x, divide by the scale,", "zh": "现在是公式。量化一个权重 x：除以缩放因子，"}, {"s": 244.64, "e": 248.1, "en": "round to the nearest whole number, then add the zero-point.", "zh": "四舍五入到整数，再加上零点。"}, {"s": 248.14, "e": 251.39, "en": "q = round(x / s) + z.", "zh": "q = round(x / s) + z"}, {"s": 251.43, "e": 256.52, "en": "Take 0.51. Divided by 0.2, that's 2.55.", "zh": "以 0.51 为例：0.51 ÷ 0.2 = 2.55，"}, {"s": 256.56, "e": 259.52, "en": "Round it, 3. Add 5, 8.", "zh": "四舍五入得 3，加 5 得 8。"}, {"s": 259.56, "e": 262.72, "en": "So 0.51 is stored as the integer 8.", "zh": "所以 0.51 被存成整数 8。"}, {"s": 262.76, "e": 263.99, "en": "Let's check two more.", "zh": "再验算两个："}, {"s": 264.03, "e": 269.16, "en": "−0.43, divided by 0.2, is −2.15.", "zh": "−0.43 ÷ 0.2 = −2.15，"}, {"s": 269.2, "e": 272.23, "en": "Round it, −2. Add 5, 3.", "zh": "取整得 −2，加 5 得 3。"}, {"s": 272.27, "e": 276.99, "en": "And 1.37, divided by 0.2, is 6.85.", "zh": "1.37 ÷ 0.2 = 6.85，"}, {"s": 277.03, "e": 279.46, "en": "Round it, 7. Add 5, 12.", "zh": "取整得 7，加 5 得 12。"}, {"s": 279.5, "e": 283.08, "en": "Do this for every weight, and our 6 decimals become", "zh": "每个权重都这样算，6 个小数就变成了"}, {"s": 283.12, "e": 288.91, "en": "0, 3, 5, 8, 12, and 15. Each fits in just 4 bits.", "zh": "0、3、5、8、12、15，每个只占 4 位。"}, {"s": 288.95, "e": 291.16, "en": "When the model runs, we go backwards.", "zh": "模型运行时，我们反过来算："}, {"s": 291.2, "e": 295.37, "en": "Subtract the zero-point, and multiply by the scale.", "zh": "减去零点，再乘以缩放因子。"}, {"s": 295.41, "e": 300.22, "en": "8 minus 5 is 3. 3 times 0.2 is 0.6.", "zh": "8 − 5 = 3，3 × 0.2 = 0.6。"}, {"s": 300.26, "e": 305.52, "en": "We stored 0.51, and we got back 0.6. A small error.", "zh": "存进去的是 0.51，取回来的是 0.6，有一点误差。"}, {"s": 305.56, "e": 308.46, "en": "Do it for the whole list, and we get back", "zh": "整个列表都这样算，得到"}, {"s": 308.5, "e": 314.42, "en": "−1, −0.4, 0, 0.6, 1.4, and 2.", "zh": "−1、−0.4、0、0.6、1.4、2。"}, {"s": 314.46, "e": 316.22, "en": "And here's the guarantee.", "zh": "这里有个保证："}, {"s": 316.26, "e": 318.28, "en": "Because we always round to the nearest tick,", "zh": "因为总是取最近的刻度，"}, {"s": 318.32, "e": 323.62, "en": "the error can never be more than half a step. Here, that's 0.1.", "zh": "误差永远不会超过半步——这里就是 0.1。"}, {"s": 323.66, "e": 327.76, "en": "Every single weight lands within 0.1 of where it started.", "zh": "每一个权重，都落在原值 0.1 的范围之内。"}, {"s": 327.8, "e": 329.76, "en": "But a model has billions of weights.", "zh": "但模型有几十亿个权重，"}, {"s": 329.8, "e": 332.87, "en": "Why don't all these little errors pile up into a big one?", "zh": "这些小误差为什么不会累积成大误差？"}, {"s": 332.91, "e": 338.18, "en": "Remember what the model does: it multiplies each input by a weight, and adds everything up.", "zh": "还记得吗：每个输入乘以一个权重，再全部加起来。"}, {"s": 338.22, "e": 341.1, "en": "Let's try it with our 6 weights and 6 inputs.", "zh": "我们用这 6 个权重和 6 个输入试试："}, {"s": 341.14, "e": 343.56, "en": "With the exact weights, the total is 1.", "zh": "用精确权重，总和是 1；"}, {"s": 343.6, "e": 346.52, "en": "With the rounded weights, the total is also 1.", "zh": "用取整后的权重，总和也是 1。"}, {"s": 346.56, "e": 347.89, "en": "Look at the errors.", "zh": "看看误差："}, {"s": 347.93, "e": 351.9, "en": "Two of the products came out a little too high, one came out a little too low,", "zh": "有两个乘积偏大了一点，一个偏小了一点，"}, {"s": 351.94, "e": 355.42, "en": "and they cancelled out. Here they cancel perfectly.", "zh": "它们互相抵消了。这里恰好完全抵消；"}, {"s": 355.46, "e": 358.84, "en": "In a real model they cancel most of the time, not always.", "zh": "在真实模型里，大多数时候会抵消，但不是每次。"}, {"s": 358.88, "e": 362.11, "en": "But the model doesn't need every weight to be perfect.", "zh": "模型不需要每个权重都完美，"}, {"s": 362.15, "e": 365.56, "en": "It needs the sums to be about right. That's why it barely notices.", "zh": "只需要\"和\"大致正确。所以它几乎察觉不到。"}, {"s": 365.6, "e": 368.44, "en": "What we just did is called asymmetric quantization.", "zh": "刚才这种叫\"非对称量化\"："}, {"s": 368.48, "e": 373.92, "en": "The range can be lopsided, −1 to 2, and the zero-point shifts to match.", "zh": "范围可以不对称（−1 到 2），零点随之移动。"}, {"s": 373.96, "e": 377.28, "en": "Its simpler cousin is symmetric quantization.", "zh": "它更简单的兄弟是\"对称量化\"："}, {"s": 377.32, "e": 382.27, "en": "Balance the range around 0, from minus the biggest value to plus the biggest value,", "zh": "让范围以 0 为中心，从 −最大值 到 +最大值，"}, {"s": 382.31, "e": 384.21, "en": "and pin the zero-point at 0.", "zh": "零点固定为 0。"}, {"s": 384.25, "e": 387.87, "en": "With 4 bits, we'd use the integers −7 to 7.", "zh": "用 4 位的话，整数取 −7 到 7。"}, {"s": 387.91, "e": 393.64, "en": "Our biggest value is 2, so the scale is 2 divided by 7, about 0.29.", "zh": "最大值是 2，所以缩放因子是 2 ÷ 7 ≈ 0.29。"}, {"s": 393.68, "e": 396.88, "en": "Now the formula is just q = round(x / s).", "zh": "公式就变成 q = round(x / s)。"}, {"s": 396.92, "e": 399.56, "en": "Less bookkeeping, faster math,", "zh": "记账更少、计算更快，"}, {"s": 399.6, "e": 403.74, "en": "but the ticks below −1 are wasted, because no weight lives there.", "zh": "但 −1 以下的刻度被浪费了，因为没有权重落在那里。"}, {"s": 403.78, "e": 407.22, "en": "Weights are usually balanced, so they tend to go symmetric.", "zh": "权重通常比较对称，所以常用对称量化；"}, {"s": 407.26, "e": 414.11, "en": "Activations, the values flowing through the network, are often lopsided, so they often go asymmetric.", "zh": "激活值（网络中流动的数值）往往偏向一边，所以常用非对称量化。"}, {"s": 414.15, "e": 417.16, "en": "Now, the real enemy: outliers.", "zh": "现在说说真正的敌人：离群值。"}, {"s": 417.2, "e": 423.12, "en": "Imagine most weights live between −1 and 1, but one strange weight is 10.", "zh": "假设大部分权重在 −1 到 1 之间，但有一个奇怪的权重是 10。"}, {"s": 423.16, "e": 427.39, "en": "Our ruler now has to stretch from −1 all the way to 10.", "zh": "尺子现在必须从 −1 一直拉到 10。"}, {"s": 427.43, "e": 433.51, "en": "That's a range of 11, split into 15 steps, so each step is about 0.73.", "zh": "范围是 11，分成 15 步，每一步大约 0.73。"}, {"s": 433.55, "e": 438.34, "en": "Every ordinary weight between −1 and 1 now lands on one of just 3 ticks.", "zh": "−1 到 1 之间的普通权重，现在只能落在 3 个刻度上。"}, {"s": 438.38, "e": 444.55, "en": "0.1, 0.2, and 0.3 all become exactly the same number.", "zh": "0.1、0.2、0.3 全都变成了同一个数。"}, {"s": 444.59, "e": 447.81, "en": "One outlier, and almost all the precision is gone.", "zh": "一个离群值，几乎所有精度都没了。"}, {"s": 447.85, "e": 452.61, "en": "And large language models really do have outliers like this.", "zh": "而大语言模型里，真的有这样的离群值。"}, {"s": 452.65, "e": 454.78, "en": "The fix is to use more rulers.", "zh": "解决办法是：多用几把尺子。"}, {"s": 454.82, "e": 460.22, "en": "Per-tensor quantization uses one scale for an entire layer, so one outlier hurts everybody.", "zh": "逐张量量化整层共用一个缩放因子，一个离群值伤到所有人；"}, {"s": 460.26, "e": 464.04, "en": "Per-channel gives every row of the weight matrix its own scale,", "zh": "逐通道让权重矩阵的每一行有自己的缩放因子，"}, {"s": 464.08, "e": 466.82, "en": "so the outlier only hurts its own row.", "zh": "离群值只伤到自己那一行；"}, {"s": 466.86, "e": 472.92, "en": "Per-group goes further, with a fresh scale for every small block, often 128 weights.", "zh": "分组量化更进一步：每一小块（常见 128 个权重）一个新的缩放因子。"}, {"s": 472.96, "e": 477.83, "en": "Now an outlier only ruins its own little neighbourhood, and everyone else keeps a fine ruler.", "zh": "这样离群值只毁掉自己那一小片，其他人都保留精细的尺子。"}, {"s": 477.87, "e": 480.78, "en": "The price is storing those extra scales.", "zh": "代价是要多存这些缩放因子："}, {"s": 480.82, "e": 485.25, "en": "For groups of 128, that's only about ⅛ of a bit more per weight.", "zh": "每 128 个一组，每个权重只多大约 1/8 位。"}, {"s": 485.29, "e": 489.63, "en": "A tiny cost, and a big part of what makes four-bit models actually work.", "zh": "代价很小，却是 4 位模型真正可用的关键之一。"}, {"s": 490.4, "e": 493.44, "en": "There's also the question of when to quantize.", "zh": "还有一个问题：什么时候量化？"}, {"s": 493.48, "e": 498.68, "en": "Post-training quantization, or PTQ, takes a finished model and converts it.", "zh": "训练后量化（PTQ）拿一个训练好的模型直接转换。"}, {"s": 498.72, "e": 502.08, "en": "For the weights that's easy, because we can just look at them.", "zh": "权重很简单，直接看就行；"}, {"s": 502.12, "e": 507.14, "en": "Activations change with every input, so we run a few hundred sample sentences through the model", "zh": "激活值随每个输入而变，所以让几百个样本句子跑过模型，"}, {"s": 507.18, "e": 511.59, "en": "and record their typical ranges. That's called calibration.", "zh": "记录它们的典型范围——这叫\"校准\"。"}, {"s": 511.63, "e": 514.84, "en": "PTQ is quick, and needs no retraining.", "zh": "PTQ 速度快，不需要重新训练。"}, {"s": 514.88, "e": 520.28, "en": "Quantization-aware training, or QAT, fakes the rounding during training itself,", "zh": "量化感知训练（QAT）在训练过程中就模拟四舍五入，"}, {"s": 520.32, "e": 522.79, "en": "so the model learns to live with it.", "zh": "让模型学会适应它。"}, {"s": 522.83, "e": 526.8, "en": "More work, but better accuracy at very low bits.", "zh": "工作量更大，但在极低位数下精度更好。"}, {"s": 526.84, "e": 530.6, "en": "You also choose what to quantize. Just the weights, which saves memory.", "zh": "你还要选择量化什么：只量化权重，省内存；"}, {"s": 530.64, "e": 537.06, "en": "Or weights and activations together, which also lets the hardware use fast integer math.", "zh": "或者权重和激活值一起量化，还能让硬件用更快的整数运算。"}, {"s": 537.1, "e": 539.37, "en": "You'll find these ideas inside popular tools.", "zh": "这些思想就藏在常用工具里。"}, {"s": 539.41, "e": 543.36, "en": "GPTQ quantizes one column at a time,", "zh": "GPTQ 一次量化一列，"}, {"s": 543.4, "e": 547.44, "en": "and nudges the remaining weights to cancel out the error it just made.", "zh": "并微调剩下的权重来抵消刚产生的误差。"}, {"s": 547.48, "e": 552.9, "en": "AWQ notices that a few weights matter far more, because they meet large activations,", "zh": "AWQ 发现少数权重格外重要（因为它们会遇到很大的激活值），"}, {"s": 552.94, "e": 554.1, "en": "and protects them before rounding.", "zh": "在取整前先保护它们。"}, {"s": 554.14, "e": 561.6, "en": "GGUF, the format used by llama.cpp, stores per-group, 4 and 5 bit weights,", "zh": "GGUF 是 llama.cpp 使用的格式，按组存储 4 位和 5 位权重，"}, {"s": 561.64, "e": 564.08, "en": "so models run on ordinary laptops.", "zh": "让模型能在普通笔记本上运行。"}, {"s": 564.12, "e": 569.96, "en": "And bitsandbytes lets you load a model in 8 or 4 bits with a single line of code.", "zh": "bitsandbytes 则让你一行代码就能以 8 位或 4 位加载模型。"}, {"s": 570.0, "e": 572.29, "en": "So what do you actually gain?", "zh": "那到底能得到什么？"}, {"s": 572.33, "e": 577.15, "en": "Going from 16 bits to 8 halves the memory, with almost no loss in quality.", "zh": "从 16 位降到 8 位，内存减半，质量几乎不变。"}, {"s": 577.19, "e": 580.52, "en": "4 bits cuts it to a quarter, usually with a small drop.", "zh": "4 位只要四分之一，通常只有一点下降。"}, {"s": 580.56, "e": 586.09, "en": "Below that, at 3 or 2 bits, quality falls off fast, unless you use special tricks.", "zh": "再往下到 3 位、2 位，质量会迅速下滑，除非用特殊技巧。"}, {"s": 586.13, "e": 588.52, "en": "Smaller weights also mean faster answers,", "zh": "权重更小，回答也更快，"}, {"s": 588.56, "e": 591.82, "en": "because the bottleneck is often just moving numbers out of memory.", "zh": "因为瓶颈往往只是把数字从内存里搬出来。"}, {"s": 591.86, "e": 593.92, "en": "And that means lower cost, less energy,", "zh": "这意味着更低的成本、更少的能耗，"}, {"s": 593.96, "e": 596.76, "en": "and models that run on your own phone, offline and private.", "zh": "以及能在你自己手机上离线、私密运行的模型。"}, {"s": 596.8, "e": 598.44, "en": "Let's put it all together.", "zh": "我们把它串起来："}, {"s": 598.48, "e": 603.8, "en": "Pick a range, and split it into steps. That's your scale.", "zh": "选一个范围，分成若干步——这是缩放因子。"}, {"s": 603.84, "e": 607.82, "en": "Mark where zero lives. That's your zero-point.", "zh": "标出 0 在哪里——这是零点。"}, {"s": 607.86, "e": 614.64, "en": "Divide, round, shift, and store small integers. Multiply back when you need them.", "zh": "除、取整、平移，存成小整数；需要时再乘回来。"}, {"s": 614.68, "e": 618.68, "en": "The error is at most half a step, the errors mostly cancel,", "zh": "误差最多半步，而且大多会互相抵消；"}, {"s": 618.72, "e": 625.05, "en": "and with smart choices about ranges, groups, and outliers, the model hardly feels it.", "zh": "只要在范围、分组和离群值上选得聪明，模型几乎感觉不到。"}, {"s": 625.09, "e": 627.39, "en": "Quantization is rounding, done cleverly.", "zh": "量化，就是聪明的四舍五入。"}, {"s": 627.43, "e": 633.43, "en": "A little precision, traded for a model you can actually run.", "zh": "用一点点精度，换来一个你真正跑得动的模型。"}];
      const layer = document.getElementById("captions-layer");
      const tl = gsap.timeline({ paused: true });
      CUES.forEach((c, i) => {

        const en = document.createElement("div"); en.className = "captions-en"; en.textContent = c.en;
        const zh = document.createElement("div"); zh.className = "captions-zh"; zh.textContent = c.zh;

        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, c.s);
        tl.to(d, { opacity: 0, duration: 0.12, ease: "none" }, Math.max(c.s + 0.2, c.e - 0.12));
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
