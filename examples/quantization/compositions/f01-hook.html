<template>
  <style>
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text.ttf"); font-style: normal; font-weight: 400 700; }
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text-italic.ttf"); font-style: italic; font-weight: 400 700; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #f01-hook-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #f01-hook-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    .f01-hook-serif { font-family: "STIX Two Text", serif; }
    .f01-hook-mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  </style>

  <div data-hf-id="hf-4ueh" id="root" data-composition-id="f01-hook" data-width="1920" data-height="1080" data-duration="21.95">
    <div data-hf-id="hf-hpzs" id="f01-hook-stage" class="clip" data-start="0" data-duration="21.95" data-track-index="1">
      <svg data-hf-id="hf-mbis" id="f01-hook-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs data-hf-id="hf-mh0t">
          <clippath data-hf-id="hf-cl5g" id="f01-hook-redclip">
            <rect data-hf-id="hf-vngk" id="f01-hook-redclip-rect" x="980" y="660" width="0" height="34" />
          </clippath>
        </defs>
        <g data-hf-id="hf-o6wg" id="f01-hook-drift">
          <text data-hf-id="hf-61sw" id="f01-hook-title" x="120" y="110" class="f01-hook-serif" font-size="44" font-style="italic" fill="#6B7488">Why can't a laptop run a 70B model?</text>

          <!-- model: tall blue bar -->
          <rect data-hf-id="hf-wr6p" id="f01-hook-bar" x="560" y="180" width="260" height="600" fill="#58C4DD" opacity="0.85" />
          <text data-hf-id="hf-9rbo" id="f01-hook-bar-num" x="870" y="220" class="f01-hook-mono" font-size="56" font-weight="700" fill="#58C4DD">0 GB</text>
          <text data-hf-id="hf-qj9l" id="f01-hook-bar-label" x="690" y="830" text-anchor="middle" class="f01-hook-mono" font-size="30" fill="#ECEEF2">70B model · FP16</text>

          <!-- GPU box -->
          <rect data-hf-id="hf-drtm" id="f01-hook-gpu" x="1000" y="677" width="260" height="103" fill="none" stroke="#5CD0B3" stroke-width="4" />
          <text data-hf-id="hf-7kia" id="f01-hook-gpu-num" x="1130" y="650" text-anchor="middle" class="f01-hook-mono" font-size="56" font-weight="700" fill="#5CD0B3">0 GB</text>
          <text data-hf-id="hf-8m6l" id="f01-hook-gpu-label" x="1130" y="830" text-anchor="middle" class="f01-hook-mono" font-size="30" fill="#ECEEF2">your GPU</text>

          <!-- won't fit -->
          <line data-hf-id="hf-fc4l" id="f01-hook-redline" x1="980" y1="677" x2="1290" y2="677" stroke="#FC6255" stroke-width="3" stroke-dasharray="10 8" clip-path="url(#f01-hook-redclip)" />
          <text data-hf-id="hf-btew" id="f01-hook-wontfit" x="1310" y="690" class="f01-hook-serif" font-size="34" font-style="italic" fill="#FC6255">won't fit</text>

          <!-- 3.14159 -> 3 -->
          <text data-hf-id="hf-zqz5" id="f01-hook-pi" x="1580" y="470" text-anchor="middle" class="f01-hook-mono" font-size="70" fill="#58C4DD" />
          <path data-hf-id="hf-rpgd" id="f01-hook-arrow" d="M1580 512 L1580 556 M1566 541 L1580 557 L1594 541" fill="none" stroke="#6B7488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <text data-hf-id="hf-ewbg" id="f01-hook-three" x="1580" y="660" text-anchor="middle" class="f01-hook-serif" font-size="110" font-weight="700" fill="#F4D35E">3</text>
        </g>
      </svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      };

      // 3.14159 as per-character tspans (typed in digit by digit)
      const pi = document.getElementById("f01-hook-pi");
      const piChars = "3.14159".split("").map((ch) => {
        const t = mk("tspan", {}, pi);
        t.textContent = ch;
        return t;
      });

      const barNum = document.getElementById("f01-hook-bar-num");
      const gpuNum = document.getElementById("f01-hook-gpu-num");
      const barCount = { v: 0 };
      const gpuCount = { v: 0 };

      const gpu = document.getElementById("f01-hook-gpu");
      const gpuLen = 2 * (260 + 103);
      gpu.style.strokeDasharray = gpuLen;

      const arrow = document.getElementById("f01-hook-arrow");
      const arrowLen = arrow.getTotalLength();
      arrow.style.strokeDasharray = arrowLen;

      const tl = gsap.timeline({ paused: true });

      // 0.2s title
      tl.fromTo("#f01-hook-title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);

      // 2.7s "70 billion parameters" — bar grows, 140 GB counts up
      tl.fromTo("#f01-hook-bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 1.6, ease: "power2.out" }, 2.7);
      tl.to(barCount, {
        v: 140, duration: 1.6, ease: "power2.out",
        onUpdate: () => { barNum.textContent = Math.round(barCount.v) + " GB"; }
      }, 2.7);
      tl.fromTo("#f01-hook-bar-num", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.7);
      tl.fromTo("#f01-hook-bar-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.2);

      // 9.0s "graphics card has 24" — GPU box draws on, 24 GB counts up
      tl.fromTo(gpu, { strokeDashoffset: gpuLen }, { strokeDashoffset: 0, duration: 1.0, ease: "power1.inOut" }, 9.0);
      tl.to(gpuCount, {
        v: 24, duration: 1.0, ease: "power2.out",
        onUpdate: () => { gpuNum.textContent = Math.round(gpuCount.v) + " GB"; }
      }, 9.0);
      tl.fromTo("#f01-hook-gpu-num", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.0);
      tl.fromTo("#f01-hook-gpu-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 9.3);

      // 10.5s red dashed limit draws left->right, "won't fit", bar tint pulse
      tl.fromTo("#f01-hook-redclip-rect", { attr: { width: 0 } }, { attr: { width: 310 }, duration: 0.7, ease: "power1.inOut" }, 10.5);
      tl.fromTo("#f01-hook-wontfit", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 11.0);
      tl.to("#f01-hook-bar", { fill: "#81ACBB", duration: 0.07, ease: "none" }, 11.2);
      tl.to("#f01-hook-bar", { fill: "#58C4DD", duration: 0.25, ease: "power1.inOut" }, 11.27);

      // 14.5s "quantization" — 3.14159 types in
      piChars.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 14.5 + i * 0.12);
      });

      // 18.6s "Rounding." — arrow draws, then the big 3 pops
      tl.fromTo(arrow, { strokeDashoffset: arrowLen }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 18.6);
      tl.fromTo("#f01-hook-three", { opacity: 0, scale: 0.4, transformOrigin: "50% 70%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 19.05);

      // ambient drift: whole board rises 6px across the scene
      tl.fromTo("#f01-hook-drift", { y: 0 }, { y: -6, duration: 21.0, ease: "sine.inOut" }, 0);

      window.__timelines["f01-hook"] = tl;
    })();
  </script>
</template>
