  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent, txt) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        if (txt !== undefined) el.textContent = txt;
        parent.appendChild(el);
        return el;
      };

      // left ruler ticks: 16 ticks, x 120 → 840 (48px)
      const lG = document.getElementById("f12-sym-asym-lticks");
      for (let i = 0; i < 16; i++) {
        const x = 120 + i * 48;
        mk("line", { x1: x, y1: 338, x2: x, y2: 382, stroke: "#ECEEF2", "stroke-width": 3 }, lG);
      }

      // right ruler ticks: 16 ticks, x 1080 → 1800 (48px), value v ↦ 1440 + 180·v
      const rG = document.getElementById("f12-sym-asym-rticks");
      const rTicks = [];
      for (let i = 0; i < 16; i++) {
        const x = 1080 + i * 48;
        rTicks.push({ el: mk("line", { x1: x, y1: 338, x2: x, y2: 382, stroke: "#ECEEF2", "stroke-width": 3 }, rG), x: x });
      }

      // pink integer indices -7 … 7 at their true positions (q·s, s = 2/7)
      const idxG = document.getElementById("f12-sym-asym-ridx");
      const idx = [];
      for (let q = -7; q <= 7; q++) {
        const x = 1440 + 180 * q * (2 / 7);
        idx.push({ el: mk("text", { x: x, y: 410, "text-anchor": "middle", "font-size": 18, fill: "#E88CC4", class: "f12-sym-asym-mono" }, idxG, String(q).replace("-", "−")), q: q });
      }

      const divider = document.getElementById("f12-sym-asym-divider");
      divider.style.strokeDasharray = 660;

      const tl = gsap.timeline({ paused: true });

      // 0.4 left header + left ruler slides in from the left
      tl.fromTo("#f12-sym-asym-h-left", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.4);
      tl.fromTo("#f12-sym-asym-lruler", { x: -520, opacity: 0 }, { x: 0, opacity: 1, duration: 1.1, ease: "power2.out" }, 0.4);
      tl.fromTo(["#f12-sym-asym-l-min", "#f12-sym-asym-l-max"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.2 }, 1.3);

      // 3.2 z marker rises at tick 5; 6.0 left formula writes in
      tl.fromTo("#f12-sym-asym-lz", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.15);
      tl.fromTo(".f12-sym-asym-lf", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.14 }, 6.0);

      // 8.6 divider draws top → bottom; 8.8 right header
      tl.fromTo(divider, { strokeDashoffset: 660 }, { strokeDashoffset: 0, duration: 0.9, ease: "power1.inOut" }, 8.6);
      tl.fromTo("#f12-sym-asym-h-right", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 8.8);

      // 12.1 right ruler grows outward from the centre (x = 1440)
      tl.fromTo("#f12-sym-asym-raxis", { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 1.8, ease: "power1.inOut" }, 12.05);
      rTicks.forEach((t) => {
        const d = Math.abs(t.x - 1440) / 360; // 0 … 1
        tl.fromTo(t.el, { opacity: 0, scaleY: 0, transformOrigin: "50% 50%" }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "back.out(1.6)" }, 12.1 + d * 1.6);
      });
      tl.fromTo("#f12-sym-asym-r-min", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.95);
      tl.fromTo("#f12-sym-asym-r-max", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 15.35);

      // 17.1 z = 0 marker rises at the centre
      tl.fromTo("#f12-sym-asym-rz", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 17.05);

      // 19.0 pink indices flash outward from 0, then settle to 40%
      idx.forEach((it) => {
        tl.fromTo(it.el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 19.0 + Math.abs(it.q) * 0.09);
      });
      tl.to(idx.map((it) => it.el), { opacity: 0.4, duration: 0.8, ease: "power1.inOut" }, 21.2);

      // 22.7 INT4 line
      tl.fromTo("#f12-sym-asym-int4", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 22.65);

      // 28.4 right formula writes in
      tl.fromTo(".f12-sym-asym-rf", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.14 }, 28.4);

      // 34.4 ticks below -1 dim; "wasted"
      rTicks.filter((t) => t.x < 1260).forEach((t, j) => {
        tl.to(t.el, { opacity: 0.35, stroke: "#6B7488", duration: 0.5, ease: "power1.inOut" }, 34.35 + j * 0.08);
      });
      tl.fromTo("#f12-sym-asym-wasted", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 34.8);

      // 38.5 weights → usually (right); 42.0 activations → often (left)
      tl.fromTo("#f12-sym-asym-wts", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 38.5);
      tl.fromTo("#f12-sym-asym-act", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 42.0);

      // ambient drift
      tl.fromTo("#f12-sym-asym-drift", { y: 0 }, { y: -6, duration: 48.35, ease: "sine.inOut" }, 0);

      window.__timelines["f12-sym-asym"] = tl;
    })();
  </script>
