<template>
  <style>
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text.ttf"); font-style: normal; font-weight: 400 700; }
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text-italic.ttf"); font-style: italic; font-weight: 400 700; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #f04-switches-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #f04-switches-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    .f04-switches-serif { font-family: "STIX Two Text", serif; }
    .f04-switches-mono { font-family: "JetBrains Mono", monospace; }
  </style>

  <div data-hf-id="hf-41tp" id="root" data-composition-id="f04-switches" data-width="1920" data-height="1080" data-duration="34.1">
    <div data-hf-id="hf-exnc" id="f04-switches-stage" class="clip" data-start="0" data-duration="34.1" data-track-index="1">
      <svg data-hf-id="hf-gdfa" id="f04-switches-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs data-hf-id="hf-mh0t">
          <clippath data-hf-id="hf-b8uh" id="f04-switches-powclip"><rect data-hf-id="hf-d06e" id="f04-switches-powclip-rect" x="1440" y="280" width="0" height="170" /></clippath>
        </defs>
        <g data-hf-id="hf-byke" id="f04-switches-drift">
          <text data-hf-id="hf-0t4k" id="f04-switches-title" x="120" y="110" class="f04-switches-serif" font-size="44" font-style="italic" fill="#6B7488">A bit is a light switch</text>
          <g data-hf-id="hf-14o6" id="f04-switches-rows" />

          <!-- 16-bit ghost row -->
          <g data-hf-id="hf-7mqe" id="f04-switches-ghost">
            <text data-hf-id="hf-i6r0" x="250" y="750" text-anchor="end" class="f04-switches-mono" font-size="30" fill="#6B7488">16 bits</text>
            <text data-hf-id="hf-1cu7" x="1000" y="750" text-anchor="middle" class="f04-switches-serif" font-size="34" fill="#6B7488">→</text>
            <text data-hf-id="hf-etwx" x="1080" y="750" class="f04-switches-mono" font-size="30" fill="#6B7488">65,536</text>
          </g>

          <!-- 2^b -->
          <g data-hf-id="hf-lm3d" clip-path="url(#f04-switches-powclip)">
            <text data-hf-id="hf-cots" id="f04-switches-pow" x="1560" y="420" text-anchor="middle" class="f04-switches-serif" font-size="120" font-style="italic" fill="#F4D35E">2<tspan data-hf-id="hf-eudn" dy="-30" font-size="56">b</tspan></text>
          </g>
          <text data-hf-id="hf-uc0e" id="f04-switches-values" x="1560" y="520" text-anchor="middle" class="f04-switches-serif" font-size="36" font-style="italic" fill="#ECEEF2">values</text>
          <text data-hf-id="hf-qipy" id="f04-switches-doubles" x="1560" y="640" text-anchor="middle" class="f04-switches-mono" font-size="30" fill="#6B7488">each switch doubles it</text>
        </g>
      </svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const OFF = "#1b2440", ON = "#F4D35E", DIM = "#6B7488", NAVY = "#0B1020";
      const mk = (tag, attrs, parent) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      };
      const rowsG = document.getElementById("f04-switches-rows");

      // rows from the confirmed sketch: label, top y, count, initial switch states
      const ROWS = [
        { label: "1 bit",  y: 180, count: "2 values",   init: [0] },
        { label: "2 bits", y: 295, count: "4 values",   init: [0, 0] },
        { label: "3 bits", y: 410, count: "8 values",   init: [1, 0, 0] },
        { label: "4 bits", y: 525, count: "16 values",  init: [0, 0, 1, 0] },
        { label: "8 bits", y: 640, count: "256 values", init: [0, 1, 0, 0, 1, 0, 0, 1] },
      ];

      const rows = ROWS.map((r) => {
        const g = mk("g", {}, rowsG);
        const label = mk("text", { x: 250, y: r.y + 48, "text-anchor": "end", "font-size": 34, fill: "#ECEEF2", class: "f04-switches-mono" }, g);
        label.textContent = r.label;
        const sws = r.init.map((on, i) => {
          const x = 300 + i * 72;
          const sg = mk("g", {}, g);
          const body = mk("rect", { x, y: r.y, width: 56, height: 80, rx: 10, fill: on ? ON : OFF, stroke: "#ECEEF2", "stroke-width": 2 }, sg);
          const knob = mk("circle", { cx: x + 28, cy: on ? r.y + 24 : r.y + 56, r: 12, fill: on ? NAVY : DIM }, sg);
          return { g: sg, body, knob, top: r.y };
        });
        const arrow = mk("text", { x: 1000, y: r.y + 52, "text-anchor": "middle", "font-size": 40, fill: DIM, class: "f04-switches-serif" }, g);
        arrow.textContent = "→";
        const count = mk("text", { x: 1080, y: r.y + 54, "font-size": 40, "font-weight": 700, fill: "#E88CC4", class: "f04-switches-mono" }, g);
        count.textContent = r.count;
        return { label, sws, arrow, count };
      });

      // the halving demo: a red "128 values" laid over the 8-bit count
      const half = mk("text", { x: 1080, y: 640 + 54, "font-size": 40, "font-weight": 700, fill: "#FC6255", class: "f04-switches-mono", opacity: 0 }, rowsG);
      half.textContent = "128 values";

      const tl = gsap.timeline({ paused: true });

      const flip = (sw, on, t) => {
        tl.to(sw.knob, { attr: { cy: on ? sw.top + 24 : sw.top + 56 }, fill: on ? NAVY : DIM, duration: 0.3, ease: "power1.inOut" }, t);
        tl.to(sw.body, { fill: on ? ON : OFF, duration: 0.3, ease: "power1.inOut" }, t);
      };
      const showRow = (row, t, countAt) => {
        tl.fromTo(row.label, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t);
        row.sws.forEach((sw, i) => {
          tl.fromTo(sw.g, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, t + 0.1 + i * 0.05);
        });
        const c = countAt == null ? t + 0.35 + row.sws.length * 0.05 : countAt;
        tl.fromTo(row.arrow, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, c);
        tl.fromTo(row.count, { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, c + 0.1);
      };

      tl.fromTo("#f04-switches-title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);

      // 0.6 row "1 bit" (off); flips on / off / on; "→ 2 values" at 7.5
      showRow(rows[0], 0.6, 7.4);
      const s1 = rows[0].sws[0];
      flip(s1, 1, 4.6); flip(s1, 0, 5.6); flip(s1, 1, 6.6);

      // 9.7 row "2 bits", cycles 00 → 01 → 10 → 11, "→ 4 values" at 11.4
      showRow(rows[1], 9.7, 11.3);
      const [a, b] = rows[1].sws;
      flip(b, 1, 10.35);
      flip(a, 1, 10.7); flip(b, 0, 10.7);
      flip(b, 1, 11.05);

      // 12.6 row "3 bits"
      showRow(rows[2], 12.6, 13.0);

      // 14.7 counts double: 2, 4, 8 pulse yellow in sequence
      [0, 1, 2].forEach((k, j) => {
        const t = 14.7 + j * 0.45;
        tl.to(rows[k].count, { fill: "#F4D35E", scale: 1.12, duration: 0.25, ease: "power2.out" }, t);
        tl.to(rows[k].count, { fill: "#E88CC4", scale: 1, duration: 0.45, ease: "power1.inOut" }, t + 0.35);
      });

      // 17.5 the big 2^b writes in (left→right reveal), "values" beneath
      tl.fromTo("#f04-switches-powclip-rect", { attr: { width: 0 } }, { attr: { width: 240 }, duration: 0.9, ease: "power2.out" }, 17.5);
      tl.fromTo("#f04-switches-pow", { y: 8 }, { y: 0, duration: 0.9, ease: "power2.out" }, 17.5);
      tl.fromTo("#f04-switches-values", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 18.2);
      tl.fromTo("#f04-switches-doubles", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 20.0);

      // 21.1 row "4 bits"; 22.9 row "8 bits"
      showRow(rows[3], 21.1, 21.6);
      showRow(rows[4], 22.9, 23.6);

      // 25.2 dim 16-bit line beneath the stack
      tl.fromTo("#f04-switches-ghost", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 25.2);

      // 28.2 remove a bit → halves: last 8-bit switch fades to 30%, count flashes 128 in red, then returns
      const last = rows[4].sws[7].g;
      tl.to(last, { opacity: 0.3, duration: 0.3, ease: "power1.inOut" }, 28.2);
      tl.to(rows[4].count, { opacity: 0, duration: 0.2 }, 28.3);
      tl.fromTo(half, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 28.35);
      tl.to(half, { opacity: 0, duration: 0.25 }, 29.5);
      tl.to(rows[4].count, { opacity: 1, duration: 0.3 }, 29.5);
      tl.to(last, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 29.5);

      // ambient drift
      tl.fromTo("#f04-switches-drift", { y: 0 }, { y: -6, duration: 33.1, ease: "sine.inOut" }, 0);

      window.__timelines["f04-switches"] = tl;
    })();
  </script>
</template>
