        tl.fromTo(el, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur || 0.8, ease: "power1.inOut" }, t);

          tl.to(d, { opacity: 0, duration: 0.25, ease: "power1.in" }, t0 + 1.05);
