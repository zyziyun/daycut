<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><rect width="1920" height="1080" fill="#0B1020"/><text x="120" y="110" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">The same ideas, inside real tools</text><rect x="110" y="170" width="395" height="560" rx="20" fill="#121a30" stroke="#F4D35E" stroke-width="3" opacity="1"/><text x="307" y="260" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="52" fill="#F4D35E" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">GPTQ</text><line x1="150" y1="300" x2="465" y2="300" stroke="#2A3247" stroke-width="2" opacity="1"/><text x="307" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">one column at a time</text><text x="307" y="440" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">push the error onto</text><text x="307" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">the remaining weights</text><rect x="545" y="170" width="395" height="560" rx="20" fill="#121a30" stroke="#5CD0B3" stroke-width="3" opacity="1"/><text x="742" y="260" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="52" fill="#5CD0B3" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">AWQ</text><line x1="585" y1="300" x2="900" y2="300" stroke="#2A3247" stroke-width="2" opacity="1"/><text x="742" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">protect the few weights</text><text x="742" y="440" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">that meet big</text><text x="742" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">activations</text><rect x="980" y="170" width="395" height="560" rx="20" fill="#121a30" stroke="#58C4DD" stroke-width="3" opacity="1"/><text x="1177" y="260" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="52" fill="#58C4DD" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">GGUF</text><line x1="1020" y1="300" x2="1335" y2="300" stroke="#2A3247" stroke-width="2" opacity="1"/><text x="1177" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">llama.cpp format</text><text x="1177" y="440" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">per-group 4/5-bit</text><text x="1177" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">runs on a laptop</text><rect x="1415" y="170" width="395" height="560" rx="20" fill="#121a30" stroke="#E88CC4" stroke-width="3" opacity="1"/><text x="1612" y="260" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="52" fill="#E88CC4" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">bitsandbytes</text><line x1="1455" y1="300" x2="1770" y2="300" stroke="#2A3247" stroke-width="2" opacity="1"/><text x="1612" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">load_in_4bit=True</text><text x="1612" y="440" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">one line of code</text><text x="1612" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="27" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">8-bit or 4-bit</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">GPTQ quantizes one column at a time, and nudges the remaining weights.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">GPTQ 一次量化一列，并微调剩下的权重来抵消误差。</text></svg>