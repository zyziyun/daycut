<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><rect width="1920" height="1080" fill="#0B1020"/><text x="120" y="110" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">A bit is a light switch</text><text x="250" y="228" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#ECEEF2" text-anchor="end" font-weight="400" font-style="normal" opacity="1">1 bit</text><rect x="300" y="180" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="328" cy="236" r="12" fill="#6B7488" opacity="1"/><text x="1000" y="232" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><text x="1080" y="234" font-family="'JetBrains Mono', Menlo, monospace" font-size="40" fill="#E88CC4" text-anchor="start" font-weight="700" font-style="normal" opacity="1">2 values</text><text x="250" y="343" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#ECEEF2" text-anchor="end" font-weight="400" font-style="normal" opacity="1">2 bits</text><rect x="300" y="295" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="328" cy="351" r="12" fill="#6B7488" opacity="1"/><rect x="372" y="295" width="56" height="80" rx="10" fill="#F4D35E" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="400" cy="319" r="12" fill="#0B1020" opacity="1"/><text x="1000" y="347" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><text x="1080" y="349" font-family="'JetBrains Mono', Menlo, monospace" font-size="40" fill="#E88CC4" text-anchor="start" font-weight="700" font-style="normal" opacity="1">4 values</text><text x="250" y="458" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#ECEEF2" text-anchor="end" font-weight="400" font-style="normal" opacity="1">3 bits</text><rect x="300" y="410" width="56" height="80" rx="10" fill="#F4D35E" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="328" cy="434" r="12" fill="#0B1020" opacity="1"/><rect x="372" y="410" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="400" cy="466" r="12" fill="#6B7488" opacity="1"/><rect x="444" y="410" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="472" cy="466" r="12" fill="#6B7488" opacity="1"/><text x="1000" y="462" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><text x="1080" y="464" font-family="'JetBrains Mono', Menlo, monospace" font-size="40" fill="#E88CC4" text-anchor="start" font-weight="700" font-style="normal" opacity="1">8 values</text><text x="250" y="573" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#ECEEF2" text-anchor="end" font-weight="400" font-style="normal" opacity="1">4 bits</text><rect x="300" y="525" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="328" cy="581" r="12" fill="#6B7488" opacity="1"/><rect x="372" y="525" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="400" cy="581" r="12" fill="#6B7488" opacity="1"/><rect x="444" y="525" width="56" height="80" rx="10" fill="#F4D35E" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="472" cy="549" r="12" fill="#0B1020" opacity="1"/><rect x="516" y="525" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="544" cy="581" r="12" fill="#6B7488" opacity="1"/><text x="1000" y="577" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><text x="1080" y="579" font-family="'JetBrains Mono', Menlo, monospace" font-size="40" fill="#E88CC4" text-anchor="start" font-weight="700" font-style="normal" opacity="1">16 values</text><text x="250" y="688" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#ECEEF2" text-anchor="end" font-weight="400" font-style="normal" opacity="1">8 bits</text><rect x="300" y="640" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="328" cy="696" r="12" fill="#6B7488" opacity="1"/><rect x="372" y="640" width="56" height="80" rx="10" fill="#F4D35E" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="400" cy="664" r="12" fill="#0B1020" opacity="1"/><rect x="444" y="640" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="472" cy="696" r="12" fill="#6B7488" opacity="1"/><rect x="516" y="640" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="544" cy="696" r="12" fill="#6B7488" opacity="1"/><rect x="588" y="640" width="56" height="80" rx="10" fill="#F4D35E" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="616" cy="664" r="12" fill="#0B1020" opacity="1"/><rect x="660" y="640" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="688" cy="696" r="12" fill="#6B7488" opacity="1"/><rect x="732" y="640" width="56" height="80" rx="10" fill="#1b2440" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="760" cy="696" r="12" fill="#6B7488" opacity="1"/><rect x="804" y="640" width="56" height="80" rx="10" fill="#F4D35E" stroke="#ECEEF2" stroke-width="2" opacity="1"/><circle cx="832" cy="664" r="12" fill="#0B1020" opacity="1"/><text x="1000" y="692" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><text x="1080" y="694" font-family="'JetBrains Mono', Menlo, monospace" font-size="40" fill="#E88CC4" text-anchor="start" font-weight="700" font-style="normal" opacity="1">256 values</text><text x="1560" y="420" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="120" fill="#F4D35E" text-anchor="middle" font-weight="400" font-style="italic" opacity="1">2<tspan dy="-30" font-size="56">b</tspan></text><text x="1560" y="520" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="36" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="italic" opacity="1">values</text><text x="1560" y="640" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">each switch doubles it</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">So with b bits, you can name two to the power b different values.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">所以 b 个比特能表示 2 的 b 次方个不同的值。</text></svg>