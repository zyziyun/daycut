<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 960px; height: 540px; }
</style>
</head>
<body>
<!-- A camera-off Zoom tile: dark panel, circular cat avatar. Replaces the
     guest's video entirely, so nothing of the guest can leak by construction. -->
<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%"  stop-color="#23262e"/>
      <stop offset="100%" stop-color="#121419"/>
    </radialGradient>
    <radialGradient id="fur" cx="42%" cy="34%" r="72%">
      <stop offset="0%"  stop-color="#FFE2B8"/>
      <stop offset="58%" stop-color="#FBC98A"/>
      <stop offset="100%" stop-color="#EDAE63"/>
    </radialGradient>
    <linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFC0C9"/>
      <stop offset="100%" stop-color="#F79CAA"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <circle cx="480" cy="256" r="150" fill="#0d0f13" stroke="#2dd4bf" stroke-width="4" opacity="0.95"/>
    <!-- cat, drawn inside the avatar circle -->
    <g transform="translate(480,256) scale(0.52) translate(-256,-272)">
      <path d="M118 148 L106 44 L206 104 Z" fill="url(#fur)" stroke="#C98B45" stroke-width="7" stroke-linejoin="round"/>
      <path d="M394 148 L406 44 L306 104 Z" fill="url(#fur)" stroke="#C98B45" stroke-width="7" stroke-linejoin="round"/>
      <path d="M133 140 L127 78 L185 113 Z" fill="url(#earIn)"/>
      <path d="M379 140 L385 78 L327 113 Z" fill="url(#earIn)"/>
      <ellipse cx="256" cy="272" rx="176" ry="158" fill="url(#fur)" stroke="#C98B45" stroke-width="7"/>
      <g stroke="#D9963F" stroke-width="11" stroke-linecap="round" opacity="0.75">
        <path d="M232 142 L222 186"/><path d="M256 136 L256 184"/><path d="M280 142 L290 186"/>
      </g>
      <ellipse cx="150" cy="300" rx="34" ry="21" fill="#F79CAA" opacity="0.5"/>
      <ellipse cx="362" cy="300" rx="34" ry="21" fill="#F79CAA" opacity="0.5"/>
      <path d="M168 262 q30 -34 60 0" fill="none" stroke="#3A2A20" stroke-width="16" stroke-linecap="round"/>
      <path d="M284 262 q30 -34 60 0" fill="none" stroke="#3A2A20" stroke-width="16" stroke-linecap="round"/>
      <path d="M238 300 h36 l-18 18 Z" fill="#E0708A"/>
      <path d="M256 318 v12" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
      <path d="M256 330 q-22 24 -40 4" fill="none" stroke="#3A2A20" stroke-width="9" stroke-linecap="round"/>
      <path d="M256 330 q22 24 40 4" fill="none" stroke="#3A2A20" stroke-width="9" stroke-linecap="round"/>
      <g stroke="#6B4E3D" stroke-width="7" stroke-linecap="round" opacity="0.85">
        <path d="M120 296 q-42 -10 -66 -22"/><path d="M118 322 q-44 2 -70 -2"/>
        <path d="M392 296 q42 -10 66 -22"/><path d="M394 322 q44 2 70 -2"/>
      </g>
    </g>
  </g>

  <text x="480" y="470" text-anchor="middle" font-family="Noto Sans SC, sans-serif"
        font-size="30" fill="#9ca3af">camera off</text>
</svg>
</body>
</html>
