# promo-recut project config (SYNTHETIC example: invented content, plausible numbers).
# Copy to <your-video-folder>/promo.config.yaml. Every path is relative to the folder holding this file.
# Times are RAW seconds of the talking-head recording unless noted; images are in image pixels.
# Find them with: tight_cut.py --suggest / --draft-subs, find_rows.py, and `ffplay -ss <t> work/audio.wav`.

talk: input/talk.mp4                 # talking-head recording (16:9)
highlights: input/highlights.mp4     # supporting video the montage is cut from (optional)
language: zh                         # whisper language (default: persona creator.language)
# whisper_model: mlx-community/whisper-large-v3-turbo
grade: "eq=brightness=-0.06:contrast=1.08:saturation=1.05:gamma=0.96"   # ffmpeg filter, applied once to the raw
hdr_tonemap: false                   # true for iPhone HLG/HDR sources (needs ffmpeg with zimg)
work_dir: work
promo_dir: promo                     # HyperFrames project written by build_promo.py
promo_dir_vertical: promo-vertical   # used by --orientation vertical
orientation: horizontal
# platform: douyin                   # vstudio.platform profile; a vertical one (xiaohongshu:full, douyin, youtube-shorts,
                                     # xiaohongshu:vertical = 3:4) derives the vertical layout from its safe/caption boxes.
                                     # --platform on the CLI overrides; unset + --orientation vertical = persona default at 9:16

# ---------------------------------------------------------------- 1. tight cut (tight_cut.py)
cut:
  body:                              # KEEP spans (raw s) that become the main talk
    - [1.0, 6.2]
    - [6.6, 21.4]
    - [22.0, 38.5]
    - [39.2, 47.9]
  outro:                             # KEEP spans for the closing lines after the montage
    - [52.0, 58.4]
  extra: {}                          # optional named extra cuts, e.g. {teaser: [[22.0, 25.0]]} -> work/teaser.mp4
  drop:                              # word ranges to remove: fillers, repeats, misspeaks (word START in [a, b))
    - [3.10, 3.42]                   # "然后" before a sentence
    - [11.96, 12.12]                 # "um"
    - [17.40, 18.30]                 # restart: first copy of a repeated phrase
    - [30.02, 30.20]
  patch:                             # [whisper_start, real_start]: whisper merged a filler into this word;
    - [24.68, 25.06]                 # real start read off the RMS envelope (--suggest prints candidates)
  pause_threshold: 0.35              # gaps longer than this are squeezed (default persona audio.pause_threshold)
  pad_in: 0.06                       # kept before a word after a squeezed pause
  pad_out: 0.08                      # kept after the last word before a squeezed pause  (~0.14 s gap)
  fillers: [然后, 就是, 那个, 嗯, 呃, um, uh]

# ---------------------------------------------------------------- 2. packaging (build_promo.py)
rates: {body: 1.3, montage: 1.1}     # playback rates (defaults: persona speed.body / speed.b_roll)

subtitles:                           # [raw_start, raw_end, text]; 【term】 renders in brand.highlight
  body:
    - [1.0, 3.0, "上周我看到一条帖子"]
    - [3.4, 6.2, "说现在可以让 AI 用【多种形式】讲清楚一个概念"]
    - [6.6, 9.8, "比如 【writing】，写一段解释"]
    - [10.0, 13.6, "或者 【diagrams】，画一张图"]
    - [14.0, 21.4, "还有一种我没试过：【explainer video】"]
    - [22.0, 27.5, "我就让我的 coding agent 去试了一下"]
    - [27.9, 31.0, "效果【真的很不错】"]
    - [31.4, 38.5, "我让它解释一个我最近在学的概念"]
    - [39.2, 43.0, "它生成了一个【几分钟的视频】"]
    - [43.4, 47.9, "大家看一看"]
  outro:
    - [52.0, 55.0, "我还把流程做成了一个 【skill】"]
    - [55.2, 58.4, "以后任何概念都能这么讲，【太好用了】"]

cards:                               # screenshot cards next to the talking head (split-screen while shown)
  - img: input/shot-post.png
    start: 3.4                       # card visible from/to (raw s)
    end: 21.4
    scroll: [[3.4, 0], [9.8, 220], [13.6, 380]]          # [raw t, image y to bring to the card top]
    highlights:                      # [raw t, y0, y1, width fraction]  (rows from find_rows.py)
      - [6.8, 351, 397, 0.30]
      - [10.2, 560, 606, 0.45]
      - [14.2, 880, 926, 0.60]
  - img: input/shot-chat.png
    start: 22.0
    end: 27.6
    scroll: [[22.0, 0], [27.4, 90]]
    box: [23.0, 180, 360]            # red box [raw t, y0, y1] around the prompt
  - img: input/shot-chat2.png
    start: 31.4
    end: 38.5
    scroll: [[31.4, 0], [38.2, 600]]
    highlights: [[33.0, 117, 164, 0.9]]
# split: [[3.4, 21.4], [22.0, 27.6]]  # optional; default = card windows with short gaps bridged

chips:                               # pills under the card: [raw t, text, star?]
  items:
    - [6.8, Writing, false]
    - [10.2, Diagrams, false]
    - [14.2, "Explainer videos ★", true]
  end: 21.4

punch: [[27.9, 31.0], [43.4, 47.9]]  # punch-in zooms on the face (raw s)

hold:                                # freeze-frame + prompt card flying out of the chat screenshot
  at: 27.7                           # raw second where the talk pauses (after the "I tried it" line)
  duration: 2.6
  image: input/prompt.png
  label: "我给 agent 的 prompt"
  fly_from: [380, -150]              # px offset the card flies from (towards the screenshot card)

montage:                             # highlights video -> framed "screen" after a zoom-through
  clips:                             # [start, end, step label | null]  (seconds of the highlights video)
    - [2.0, 10.0, "为什么需要它"]
    - [40.0, 47.5, "核心直觉"]
    - [60.0, 63.0, null]             # null = transitional fragment, previous label continues
    - [80.0, 88.0, "第一步"]
    - [120.0, 128.0, "第二步"]
    - [200.0, 207.0, "总结"]
  crossfade: 0.3                     # baked internal crossfades
  zoom_through: 0.5                  # body / montage overlap (body keeps playing underneath)
  scale: "1920:1080"
  title: 成片精选
  title_sub: agent 生成的完整讲解 · 节选
  badge: 精选
  tag: 完整版 · 节选 · 1.1×

outro:
  punch_at: 55.2                     # raw s: punch-in, stamp lands 0.9 s later
  stamp: 好用

chapters:                            # [anchor, label]; anchor = raw body second | start | montage | outro
  - [start, 起因]
  - [14.0, 讲解视频]
  - [22.0, 实验]
  - [montage, 精选]
  - [outro, skill]

end_card:
  kicker: "Explainer videos, on any topic."
  main: 下一个概念，你想看什么？
  sub: 评论区告诉我 ↓
  duration: 3.2

# layout:                            # optional per-orientation geometry overrides (see GEO in build_promo.py)
#   horizontal: {split_inset: "inset(40px 520px 120px 500px round 28px)", split_x: -440}
#   vertical: {face: [0.46, 0.38]}   # speaker's face centre (fraction of the talk frame); default = detected
#                                     # with vstudio.face on 6 frames, else centred. Any GEO key overrides too.

# ---------------------------------------------------------------- 3. cover (make_cover.py)
cover:
  photo: {talk_at: 30.5}             # or {image: input/cover-face.png}
  retouch: {slim: 0.05, eye: 0.04, makeup: 0.5, body: 0.07}   # vstudio.retouch; false = off
  brighten: 1.03
  quote: "“the format I am most excited about”"
  attribution: "— a post I read last week"
  title: [让 AI 给你做, 一支讲解视频]
  title_highlight: 讲解视频
  thumb: {highlights_at: 168.0, crop: [0, 150, 1920, 830]}    # crop rows from find_rows.py
  chips: ["Agent × HTML video", "一个概念 · 10 分钟"]
  tag: 亲测
  note: 记笔记 ↓
  sizes:
    - {w: 1440, h: 1080, photo_w: 760, out: cover-4x3.jpg}
    - {w: 1920, h: 1080, photo_w: 900, out: cover-16x9.jpg}
    - {w: 1080, h: 1440, photo_w: 760, out: cover-3x4.jpg}    # portrait: photo_w = photo band height

# ---------------------------------------------------------------- 4. post copy (post_copy.py)
post:
  title: 让 AI 给你做一支讲解视频
  body:
    - 上周看到一个说法：AI 可以用视频讲清楚任何概念。我让 agent 试了一下。
    - 完整视频和做法放在下面，自取。
  links:
    - [完整版, "https://example.com/full-video"]
    - [skill, "https://example.com/skill-repo"]
  tags: [AI工具, 学习方法]
  out: post.md
