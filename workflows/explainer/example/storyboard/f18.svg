pacity="1"/><circle cx="526.0" cy="160" r="11" fill="#58C4DD" opacity="1"/><circle cx="726.6666666666666" cy="160" r="11" fill="#58C4DD" opacity="1"/><circle cx="964.6666666666666" cy="160" r="11" fill="#58C4DD" opacity="1"/><circle cx="1366.0" cy="160" r="11" fill="#58C4DD" opacity="1"/><circle cx="1660.0" cy="160" r="11" fill="#58C4DD" opacity="1"/><text x="560" y="340" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="50" fill="#F4D35E" text-anchor="end" font-weight="400" font-style="italic" opacity="1">s</text><text x="620" y="340" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">pick a range, split it into steps</text><text x="560" y="420" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="50" fill="#5CD0B3" text-anchor="end" font-weight="400" font-style="italic" opacity="1">z</text><text x="620" y="420" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">mark where zero lives</text><text x="560" y="500" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="50" fill="#E88CC4" text-anchor="end" font-weight="400" font-style="italic" opacity="1">q</text><text x="620" y="500" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">divide · round · shift → store</text><text x="560" y="580" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="50" fill="#58C4DD" text-anchor="end" font-weight="400" font-style="italic" opacity="1">x̂</text><text x="620" y="580" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">multiply back when needed</text><text x="960" y="760" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="64" fill="#F4D35E" text-anchor="middle" font-weight="400" font-style="italic" opacity="1">Quantization is rounding, done cleverly.</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">A little precision, traded for a model you can actually run.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">用一点点精度，换来一个你真正跑得动的模型。</text></svg>