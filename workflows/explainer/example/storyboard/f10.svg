ty="1">3</text><text x="1355" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">-0.4</text><text x="1355" y="460" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">-0.43</text><text x="1460" y="300" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#E88CC4" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">5</text><text x="1460" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0</text><text x="1460" y="460" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0</text><text x="1565" y="300" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#E88CC4" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">8</text><text x="1565" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0.6</text><text x="1565" y="460" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0.51</text><text x="1670" y="300" font-family="'JetBrains Mono', Menlo, monospace" font-size="34" fill="#E88CC4" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">12</text><text x="1670" y="380" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">1.4</text><text x="1670" y="460" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal"