<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><rect width="1920" height="1080" fill="#0B1020"/><text x="120" y="110" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">What do you gain, and lose?</text><line x1="240" y1="720" x2="1500" y2="720" stroke="#6B7488" stroke-width="2" opacity="1"/><rect x="280" y="240.0" width="120" height="480.0" rx="0" fill="#58C4DD" opacity="0.75"/><text x="340" y="770" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">16-bit</text><text x="340" y="280.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#0B1020" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">140 GB</text><rect x="540" y="480.0" width="120" height="240.0" rx="0" fill="#58C4DD" opacity="0.75"/><text x="600" y="770" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">8-bit</text><text x="600" y="520.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#0B1020" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">70 GB</text><rect x="800" y="600.0" width="120" height="120.0" rx="0" fill="#58C4DD" opacity="0.75"/><text x="860" y="770" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">4-bit</text><text x="860" y="580.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#58C4DD" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">35 GB</text><rect x="1060" y="630.0" width="120" height="90.0" rx="0" fill="#58C4DD" opacity="0.75"/><text x="1120" y="770" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">3-bit</text><text x="1120" y="610.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#58C4DD" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">26 GB</text><rect x="1320" y="660.0" width="120" height="60.0" rx="0" fill="#58C4DD" opacity="0.75"/><text x="1380" y="770" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">2-bit</text><text x="1380" y="640.0" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#58C4DD" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">18 GB</text><polyline points="340,200.0 600,205.19999999999993 860,220.79999999999995 1120,278.0 1380,434.0" fill="none" stroke="#F4D35E" stroke-width="5"/><circle cx="340" cy="200.0" r="9" fill="#F4D35E" opacity="1"/><circle cx="600" cy="205.19999999999993" r="9" fill="#F4D35E" opacity="1"/><circle cx="860" cy="220.79999999999995" r="9" fill="#F4D35E" opacity="1"/><circle cx="1120" cy="278.0" r="9" fill="#F4D35E" opacity="1"/><circle cx="1380" cy="434.0" r="9" fill="#F4D35E" opacity="1"/><text x="1560" y="190" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="30" fill="#F4D35E" text-anchor="start" font-weight="400" font-style="italic" opacity="1">quality</text><text x="1560" y="240" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="30" fill="#58C4DD" text-anchor="start" font-weight="400" font-style="italic" opacity="1">memory</text><text x="1600" y="380" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="34" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">faster</text><text x="1600" y="460" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="34" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">cheaper</text><text x="1600" y="540" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="34" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">less energy</text><text x="1600" y="620" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="34" fill="#ECEEF2" text-anchor="start" font-weight="400" font-style="normal" opacity="1">on your phone</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">Four bits cuts the memory to a quarter, usually with a small drop.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">4 位只要四分之一内存，通常只有一点下降。</text></svg>