<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><rect width="1920" height="1080" fill="#0B1020"/><text x="120" y="110" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">When do you quantize?</text><text x="110" y="255" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#F4D35E" text-anchor="start" font-weight="700" font-style="normal" opacity="1">PTQ</text><rect x="300" y="200" width="240" height="90" rx="14" fill="none" stroke="#ECEEF2" stroke-width="3" opacity="1"/><text x="420.0" y="257" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">train ✓</text><text x="575" y="255" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><rect x="610" y="200" width="460" height="90" rx="14" fill="none" stroke="#58C4DD" stroke-width="3" opacity="1"/><text x="840.0" y="257" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">calibrate (samples)</text><text x="1115" y="255" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><rect x="1160" y="200" width="300" height="90" rx="14" fill="none" stroke="#E88CC4" stroke-width="3" opacity="1"/><text x="1310.0" y="257" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#E88CC4" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">quantize</text><text x="1520" y="255" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="28" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">fast · no retraining</text><text x="110" y="455" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#5CD0B3" text-anchor="start" font-weight="700" font-style="normal" opacity="1">QAT</text><rect x="300" y="400" width="770" height="90" rx="14" fill="none" stroke="#5CD0B3" stroke-width="3" opacity="1"/><text x="685.0" y="457" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#5CD0B3" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">train with fake rounding ↺</text><text x="1110" y="455" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">→</text><rect x="1160" y="400" width="300" height="90" rx="14" fill="none" stroke="#E88CC4" stroke-width="3" opacity="1"/><text x="1310.0" y="457" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#E88CC4" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">quantize</text><text x="1520" y="455" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="28" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">more work · better at low bits</text><rect x="260" y="610" width="620" height="110" rx="55" fill="none" stroke="#58C4DD" stroke-width="3" opacity="1"/><text x="570" y="677" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">weights only → less memory</text><rect x="1000" y="610" width="680" height="110" rx="55" fill="none" stroke="#F4D35E" stroke-width="3" opacity="1"/><text x="1340" y="677" font-family="'JetBrains Mono', Menlo, monospace" font-size="32" fill="#F4D35E" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">+ activations → integer math</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">Quantization-aware training fakes the rounding during training itself.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">量化感知训练（QAT）在训练过程中就模拟四舍五入。</text></svg>