7" y2="492" stroke="#ECEEF2" stroke-width="3" opacity="1"/><line x1="1660.0" y1="448" x2="1660.0" y2="492" stroke="#ECEEF2" stroke-width="3" opacity="1"/><circle cx="260.0" cy="420" r="13" fill="#58C4DD" opacity="1"/><text x="260.0" y="385" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">-1</text><circle cx="526.0" cy="420" r="13" fill="#58C4DD" opacity="1"/><text x="526.0" y="385" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">-0.43</text><circle cx="726.6666666666666" cy="420" r="13" fill="#58C4DD" opacity="1"/><text x="726.6666666666666" y="385" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0</text><circle cx="964.6666666666666" cy="420" r="13" fill="#58C4DD" opacity="1"/><text x="964.6666666666666" y="385" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0.51</text><circle cx="1366.0" cy="420" r="13" fill="#58C4DD" opacity="1"/><text x="1366.0" y="385" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">1.37</text><circle cx="1660.0" cy="420" r="13" fill="#58C4DD" opacity="1"/><text x="1660.0" y="385" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">2</text><path d="M260 300 Q260 270 300 270 L920 270 Q960 270 960 240 Q960 270 1000 270 L1620 270 Q1660 270 1660 300" fill="none" stroke="#ECEEF2" stroke-width="3"/><text x="960" y="215" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="40" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="italic" opacity="1">range = 2 − (−1) = 3</text><rect x="260.0" y="500" width="93.33333333333331" height="24" rx="0" fill="#F4D35E" opacity="0.8"/><text x="306.66666666666663" y="560" font-family="'JetBrains Mono', Menlo, monospace" font-size="24" fill="#F4D35E" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">one step</text><text x="960" y="720" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="64" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1"><tspan fill="#F4D35E" font-style="italic">s</tspan> = 3 ÷ 15 gaps = <tspan fill="#F4D35E">0.2</tspan></text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">Three, shared across fifteen gaps, gives a step of zero point two.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">3 分成 15 份，每一步是 0.2。这叫“缩放因子” s。</text></svg>