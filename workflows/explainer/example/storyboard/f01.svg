<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><rect width="1920" height="1080" fill="#0B1020"/><text x="120" y="110" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="44" fill="#6B7488" text-anchor="start" font-weight="400" font-style="italic" opacity="1">Why can't a laptop run a 70B model?</text><rect x="560" y="180" width="260" height="600" rx="0" fill="#58C4DD" opacity="0.85"/><text x="870" y="220" font-family="'JetBrains Mono', Menlo, monospace" font-size="56" fill="#58C4DD" text-anchor="start" font-weight="700" font-style="normal" opacity="1">140 GB</text><text x="690" y="830" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">70B model · FP16</text><rect x="1000" y="677" width="260" height="103" rx="0" fill="none" stroke="#5CD0B3" stroke-width="4" opacity="1"/><text x="1130" y="650" font-family="'JetBrains Mono', Menlo, monospace" font-size="56" fill="#5CD0B3" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">24 GB</text><text x="1130" y="830" font-family="'JetBrains Mono', Menlo, monospace" font-size="30" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">your GPU</text><line x1="980" y1="677" x2="1290" y2="677" stroke="#FC6255" stroke-width="3" stroke-dasharray="10 8" opacity="1"/><text x="1310" y="690" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="34" fill="#FC6255" text-anchor="start" font-weight="400" font-style="italic" opacity="1">won't fit</text><text x="1580" y="470" font-family="'JetBrains Mono', Menlo, monospace" font-size="70" fill="#58C4DD" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">3.14159</text><text x="1580" y="560" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="60" fill="#6B7488" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">↓</text><text x="1580" y="660" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="110" fill="#F4D35E" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">3</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">The trick is called quantization. At its heart: rounding.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">这个技巧叫做“量化”。它的核心：四舍五入。</text></svg>