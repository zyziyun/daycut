"/><circle cx="231.36363636363637" cy="326" r="9" fill="#58C4DD" opacity="1"/><circle cx="243.63636363636365" cy="304" r="9" fill="#58C4DD" opacity="1"/><circle cx="255.9090909090909" cy="370" r="9" fill="#58C4DD" opacity="1"/><circle cx="268.1818181818182" cy="348" r="9" fill="#58C4DD" opacity="1"/><circle cx="280.4545454545455" cy="326" r="9" fill="#58C4DD" opacity="1"/><circle cx="292.72727272727275" cy="304" r="9" fill="#58C4DD" opacity="1"/><circle cx="305.0" cy="370" r="9" fill="#58C4DD" opacity="1"/><circle cx="317.27272727272725" cy="348" r="9" fill="#58C4DD" opacity="1"/><circle cx="329.54545454545456" cy="326" r="9" fill="#58C4DD" opacity="1"/><circle cx="341.8181818181818" cy="304" r="9" fill="#58C4DD" opacity="1"/><circle cx="354.0909090909091" cy="370" r="9" fill="#58C4DD" opacity="1"/><circle cx="366.3636363636364" cy="348" r="9" fill="#58C4DD" opacity="1"/><circle cx="378.6363636363636" cy="326" r="9" fill="#58C4DD" opacity="1"/><circle cx="390.9090909090909" cy="304" r="9" fill="#58C4DD" opacity="1"/><circle cx="403.1818181818182" cy="370" r="9" fill="#58C4DD" opacity="1"/><circle cx="415.4545454545455" cy="348" r="9" fill="#58C4DD" opacity="1"/><circle cx="427.72727272727275" cy="326" r="9" fill="#58C4DD" opacity="1"/><circle cx="440.0" cy="304" r="9" fill="#58C4DD" opacity="1"/><circle cx="452.27272727272725" cy="370" r="9" fill="#58C4DD" opacity="1"/><circle cx="464.54545454545456" cy="348" r="9" fill="#58C4DD" opacity="1"/><circle cx="1700.0" cy="370" r="16" fill="#FC6255" opacity="1"/><text x="1700.0" y="330" font-family="'JetBrains Mono', Menlo, monospace" font-size="40" fill="#FC6255" text-anchor="middle" font-weight="700" font-style="normal" opacity="1">10</text><rect x="185" y="300" width="230" height="160" rx="10" fill="none" stroke="#FC6255" stroke-width="2" opacity="0.8"/><text x="300" y="500" font-family="'JetBrains Mono', Menlo, monospace" font-size="28" fill="#FC6255" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">only 3 ticks</text><text x="960" y="230" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="56" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1"><tspan fill="#F4D35E" font-style="italic">s</tspan> = (10 − (−1)) ÷ 15 ≈ <tspan fill="#F4D35E">0.73</tspan></text><text x="960" y="660" font-family="'JetBrains Mono', Menlo, monospace" font-size="44" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0.1 → 0&#160;&#160;&#160;&#160;&#160;0.2 → 0&#160;&#160;&#160;&#160;&#160;0.3 → 0</text><text x="960" y="740" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="34" fill="#FC6255" text-anchor="middle" font-weight="400" font-style="italic" opacity="1">same integer — the detail is gone</text><rect x="0" y="850" width="1920" height="230" rx="0" fill="#000" opacity="0.35"/><text x="960" y="925" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="38" fill="#ECEEF2" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">Zero point one, zero point two, and zero point three all become exactly the same number.</text><text x="960" y="990" font-family="'Noto Sans SC', 'PingFang SC', sans-serif" font-size="36" fill="#C9CED8" text-anchor="middle" font-weight="400" font-style="normal" opacity="1">0.1、0.2、0.3 全都变成了同一个数。</text></svg>