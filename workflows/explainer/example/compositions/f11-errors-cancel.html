<template>
  <style>
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text.ttf"); font-style: normal; font-weight: 400 700; }
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text-italic.ttf"); font-style: italic; font-weight: 400 700; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #f11-errors-cancel-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #f11-errors-cancel-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    .f11-errors-cancel-serif { font-family: "STIX Two Text", serif; }
    .f11-errors-cancel-mono { font-family: "JetBrains Mono", monospace; }
  </style>

  <div data-hf-id="hf-1rxu" id="root" data-composition-id="f11-errors-cancel" data-width="1920" data-height="1080" data-duration="38.9">
    <div data-hf-id="hf-3asp" id="f11-errors-cancel-stage" class="clip" data-start="0" data-duration="38.9" data-track-index="1">
      <svg data-hf-id="hf-h87a" id="f11-errors-cancel-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <g data-hf-id="hf-yl0c" id="f11-errors-cancel-drift">
          <text data-hf-id="hf-5as6" id="f11-errors-cancel-title" x="120" y="110" class="f11-errors-cancel-serif" font-size="44" font-style="italic" fill="#6B7488">Why small errors don't pile up</text>

          <!-- column headers -->
          <g data-hf-id="hf-4bjy" id="f11-errors-cancel-headers" class="f11-errors-cancel-mono" font-size="28" text-anchor="middle">
            <text data-hf-id="hf-unla" x="330" y="200" fill="#6B7488">input</text>
            <text data-hf-id="hf-k5iu" x="560" y="200" fill="#58C4DD">exact w</text>
            <text data-hf-id="hf-j146" x="800" y="200" fill="#E88CC4">rounded ŵ</text>
            <text data-hf-id="hf-y2nh" x="1060" y="200" fill="#FC6255">error in product</text>
          </g>

          <g data-hf-id="hf-a3cw" id="f11-errors-cancel-rows" />

          <line data-hf-id="hf-l78c" id="f11-errors-cancel-rule" x1="240" y1="640" x2="1200" y2="640" stroke="#2A3247" stroke-width="2" />

          <!-- sums -->
          <text data-hf-id="hf-dyn7" id="f11-errors-cancel-sum-w" x="560" y="700" text-anchor="middle" class="f11-errors-cancel-mono" font-size="40" font-weight="700" fill="#58C4DD">Σ = 0.00</text>
          <text data-hf-id="hf-zbdr" id="f11-errors-cancel-sum-q" x="800" y="700" text-anchor="middle" class="f11-errors-cancel-mono" font-size="40" font-weight="700" fill="#E88CC4">Σ = 0.00</text>

          <!-- cancellation line (built char-aligned in script) -->
          <g data-hf-id="hf-gwn4" id="f11-errors-cancel-cancel" class="f11-errors-cancel-mono" font-size="30" fill="#FC6255" />
          <g data-hf-id="hf-afq0" id="f11-errors-cancel-flyers" class="f11-errors-cancel-mono" fill="#FC6255" />

          <!-- right column -->
          <text data-hf-id="hf-3f92" id="f11-errors-cancel-sum1" x="1560" y="380" text-anchor="middle" class="f11-errors-cancel-serif" font-size="50" font-style="italic" fill="#ECEEF2">the sum</text>
          <text data-hf-id="hf-69nv" id="f11-errors-cancel-sum2" x="1560" y="450" text-anchor="middle" class="f11-errors-cancel-serif" font-size="50" font-style="italic" fill="#ECEEF2">is what matters</text>
          <text data-hf-id="hf-krkk" id="f11-errors-cancel-mostly" x="1560" y="560" text-anchor="middle" class="f11-errors-cancel-mono" font-size="32" fill="#6B7488">errors mostly cancel</text>
        </g>
      </svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent, txt) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        if (txt !== undefined) el.textContent = txt;
        parent.appendChild(el);
        return el;
      };

      const ROW_Y = [260, 322, 384, 446, 508, 570];
      const INPUT = ["1", "2", "1", "−1", "1", "1"];
      const EXACT = ["−1", "−0.43", "0", "0.51", "1.37", "2"];
      const ROUND = ["−1", "−0.4", "0", "0.6", "1.4", "2"];
      const ERR = ["0", "+0.06", "0", "−0.09", "+0.03", "0"];

      const rowsG = document.getElementById("f11-errors-cancel-rows");
      const inCells = [], wCells = [], qCells = [], eCells = [];
      ROW_Y.forEach((y, i) => {
        const base = { y: y, "text-anchor": "middle", "font-size": 34, class: "f11-errors-cancel-mono" };
        inCells.push(mk("text", Object.assign({ x: 330, fill: "#ECEEF2" }, base), rowsG, INPUT[i]));
        wCells.push(mk("text", Object.assign({ x: 560, fill: "#58C4DD" }, base), rowsG, EXACT[i]));
        qCells.push(mk("text", Object.assign({ x: 800, fill: "#E88CC4" }, base), rowsG, ROUND[i]));
        eCells.push(mk("text", Object.assign({ x: 1060, fill: ERR[i] === "0" ? "#6B7488" : "#FC6255" }, base), rowsG, ERR[i]));
      });

      // cancellation line "+0.06 − 0.09 + 0.03 = 0", centred at x=1060, mono 30 (char width 18)
      const LINE = "+0.06 − 0.09 + 0.03 = 0";
      const CW = 18, LX0 = 1060 - (LINE.length * CW) / 2, LY = 770;
      const cx = (a, b) => LX0 + ((a + b + 1) / 2) * CW; // centre of chars a..b
      const cancelG = document.getElementById("f11-errors-cancel-cancel");
      const seg = (a, b) => mk("text", { x: cx(a, b), y: LY, "text-anchor": "middle" }, cancelG, LINE.slice(a, b + 1));
      const lineA = seg(0, 4);    // +0.06
      const lineB = seg(6, 11);   // − 0.09
      const lineC = seg(13, 18);  // + 0.03
      const lineEq = seg(20, 22); // = 0

      // flyers: copies of the three red error cells that travel into the line
      const flyG = document.getElementById("f11-errors-cancel-flyers");
      const flyDefs = [
        { row: 1, txt: "+0.06", tx: cx(0, 4) },
        { row: 3, txt: "−0.09", tx: cx(6, 11) },
        { row: 4, txt: "+0.03", tx: cx(13, 18) },
      ];
      const flyers = flyDefs.map((d) => mk("text", { x: 1060, y: ROW_Y[d.row], "text-anchor": "middle", "font-size": 34, opacity: 0 }, flyG, d.txt));

      const fmt = (v) => "Σ = " + v.toFixed(2);
      const sumW = document.getElementById("f11-errors-cancel-sum-w");
      const sumQ = document.getElementById("f11-errors-cancel-sum-q");
      const cW = { v: 0 }, cQ = { v: 0 };

      const rule = document.getElementById("f11-errors-cancel-rule");
      rule.style.strokeDasharray = 960;

      const tl = gsap.timeline({ paused: true });

      // 0.2 title
      tl.fromTo("#f11-errors-cancel-title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);

      // 5.5 headers
      tl.fromTo("#f11-errors-cancel-headers text", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", stagger: 0.12 }, 5.45);

      // 10.8 input + exact w cells waterfall
      ROW_Y.forEach((y, i) => {
        tl.fromTo([inCells[i], wCells[i]], { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.75 + i * 0.15);
      });

      // 13.5 rule draws, 13.7 blue sum counts 0.00 -> 1.00
      tl.fromTo(rule, { strokeDashoffset: 960 }, { strokeDashoffset: 0, duration: 0.6, ease: "power1.inOut" }, 13.4);
      tl.fromTo(sumW, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 13.6);
      tl.fromTo(cW, { v: 0 }, { v: 1, duration: 1.2, ease: "power1.inOut", immediateRender: false, onUpdate: () => { sumW.textContent = fmt(cW.v); } }, 13.7);

      // 16.2 rounded column waterfall, then pink sum counts
      ROW_Y.forEach((y, i) => {
        tl.fromTo(qCells[i], { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 16.15 + i * 0.12);
      });
      tl.fromTo(sumQ, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 17.2);
      tl.fromTo(cQ, { v: 0 }, { v: 1, duration: 1.2, ease: "power1.inOut", immediateRender: false, onUpdate: () => { sumQ.textContent = fmt(cQ.v); } }, 17.3);

      // 19.1 error column: zeros dim first, then the red errors on their cues
      [0, 2, 5].forEach((r, j) => {
        tl.fromTo(eCells[r], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 19.1 + j * 0.15);
      });
      [[1, 20.6], [4, 22.0], [3, 23.1]].forEach(([r, t]) => {
        tl.fromTo(eCells[r], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t);
      });

      // 24.5 the three red errors fly down into the sum line
      flyDefs.forEach((d, j) => {
        const f = flyers[j];
        const t0 = 24.5 + j * 0.15;
        tl.fromTo(f, { opacity: 1, attr: { x: 1060, y: ROW_Y[d.row], "font-size": 34 } },
          { attr: { x: d.tx, y: LY, "font-size": 30 }, duration: 0.9, ease: "power1.inOut" }, t0);
        tl.to(f, { opacity: 0, duration: 0.2 }, t0 + 0.9);
      });
      [lineA, lineB, lineC].forEach((el, j) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 24.5 + j * 0.15 + 0.85);
      });
      tl.fromTo(lineEq, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 25.9);
      tl.to(lineEq, { scale: 1.25, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 26.5);

      // 28.0 errors mostly cancel
      tl.fromTo("#f11-errors-cancel-mostly", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 27.95);

      // 34.7 the sum / is what matters
      tl.fromTo("#f11-errors-cancel-sum1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 34.6);
      tl.fromTo("#f11-errors-cancel-sum2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 34.9);

      // 37.0 both sums pulse together
      tl.to([sumW, sumQ], { scale: 1.12, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 37.0);

      // ambient drift
      tl.fromTo("#f11-errors-cancel-drift", { y: 0 }, { y: -6, duration: 37.6, ease: "sine.inOut" }, 0);

      window.__timelines["f11-errors-cancel"] = tl;
    })();
  </script>
</template>
