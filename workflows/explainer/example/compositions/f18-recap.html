<template>
  <style>
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text.ttf"); font-style: normal; font-weight: 400 700; }
    @font-face { font-family: "STIX Two Text"; src: url("assets/fonts/stix-two-text-italic.ttf"); font-style: italic; font-weight: 400 700; }
    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #f18-recap-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #f18-recap-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    .f18-recap-serif { font-family: "STIX Two Text", serif; }
    .f18-recap-mono { font-family: "JetBrains Mono", monospace; }
  </style>

  <div data-hf-id="hf-mpe4" id="root" data-composition-id="f18-recap" data-width="1920" data-height="1080" data-duration="37.2">
    <div data-hf-id="hf-p9ef" id="f18-recap-stage" class="clip" data-start="0" data-duration="37.2" data-track-index="1">
      <svg data-hf-id="hf-zigu" id="f18-recap-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs data-hf-id="hf-o8gy" id="f18-recap-defs" />
        <g data-hf-id="hf-4kf1" id="f18-recap-fade">
          <g data-hf-id="hf-yo88" id="f18-recap-drift">
            <!-- ruler callback -->
            <line data-hf-id="hf-un4g" id="f18-recap-axis" x1="230" y1="200" x2="1690" y2="200" stroke="#6B7488" stroke-width="3" />
            <g data-hf-id="hf-b9sb" id="f18-recap-ticks" />
            <g data-hf-id="hf-fppr" id="f18-recap-dots" />

            <!-- recipe -->
            <g data-hf-id="hf-vp7t" id="f18-recap-recipe" />

            <!-- closing line -->
            <text data-hf-id="hf-xi9r" id="f18-recap-close" x="960" y="760" text-anchor="middle" class="f18-recap-serif" font-size="64" font-style="italic" fill="#F4D35E" />
          </g>
        </g>
      </svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      };

      // ruler (same geometry as frames 06-08, raised to y=200)
      const X0 = 260, X1 = 1660, Y = 200;
      const step = (X1 - X0) / 15;
      const X = (v) => X0 + (v + 1) / 3 * (X1 - X0);
      const ticksG = document.getElementById("f18-recap-ticks");
      const dotsG = document.getElementById("f18-recap-dots");
      const ticks = [], dots = [];
      for (let i = 0; i < 16; i++) {
        ticks.push(mk("line", { x1: X0 + i * step, y1: Y - 22, x2: X0 + i * step, y2: Y + 22, stroke: "#ECEEF2", "stroke-width": 3 }, ticksG));
      }
      [-1.0, -0.43, 0.0, 0.51, 1.37, 2.0].forEach((v) => {
        dots.push(mk("circle", { cx: X(v), cy: 160, r: 11, fill: "#58C4DD" }, dotsG));
      });

      // recipe lines
      const defs = document.getElementById("f18-recap-defs");
      const recipeG = document.getElementById("f18-recap-recipe");
      const R = [
        { sym: "s", col: "#F4D35E", txt: "pick a range, split it into steps", y: 340, t: 2.0, w: 620 },
        { sym: "z", col: "#5CD0B3", txt: "mark where zero lives", y: 420, t: 7.4, w: 420 },
        { sym: "q", col: "#E88CC4", txt: "divide · round · shift → store", y: 500, t: 11.4, w: 580 },
        { sym: "x̂", col: "#58C4DD", txt: "multiply back when needed", y: 580, t: 15.5, w: 500 }
      ];
      const rows = R.map((r, i) => {
        const sym = mk("text", { x: 560, y: r.y, "text-anchor": "end", "font-size": 50, "font-style": "italic", fill: r.col, class: "f18-recap-serif" }, recipeG);
        sym.textContent = r.sym;
        const cp = mk("clipPath", { id: "f18-recap-clip" + i }, defs);
        const cr = mk("rect", { x: 610, y: r.y - 50, width: 0, height: 70 }, cp);
        const txt = mk("text", { x: 620, y: r.y, "font-size": 40, fill: "#ECEEF2", class: "f18-recap-serif", "clip-path": "url(#f18-recap-clip" + i + ")" }, recipeG);
        txt.textContent = r.txt;
        return { sym: sym, cr: cr, txt: txt, r: r };
      });

      // closing line, one tspan per character
      const close = document.getElementById("f18-recap-close");
      const chars = [];
      Array.from("Quantization is rounding, done cleverly.").forEach((c) => {
        const ts = mk("tspan", {}, close);
        ts.textContent = c;
        chars.push(ts);
      });

      const tl = gsap.timeline({ paused: true });

      // 0.4s ruler returns
      tl.fromTo("#f18-recap-axis", { attr: { x2: 230 } }, { attr: { x2: 1690 }, duration: 0.7, ease: "power1.inOut" }, 0.4);
      ticks.forEach((t, i) => {
        tl.fromTo(t, { opacity: 0, scaleY: 0, transformOrigin: "50% 50%" }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.5 + i * 0.03);
      });
      dots.forEach((d, i) => {
        tl.fromTo(d, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0 + i * 0.1);
      });

      // recipe: symbol pops, then text writes in
      rows.forEach((row) => {
        const t = row.r.t;
        tl.fromTo(row.sym, { opacity: 0, scale: 0.4, transformOrigin: "100% 70%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, t - 0.1);
        tl.fromTo(row.cr, { attr: { width: 0 } }, { attr: { width: row.r.w + 40 }, duration: 1.1, ease: "power1.inOut" }, t + 0.3);
      });

      // 28.6s closing line writes in, characters left -> right over 1.4s
      const per = 1.4 / chars.length;
      chars.forEach((c, i) => {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 28.6 + i * per);
      });

      // ambient drift: 4px across the whole scene (the only motion during the held frame)
      tl.fromTo("#f18-recap-drift", { y: 0 }, { y: -4, duration: 37.0, ease: "sine.inOut" }, 0);

      // final fade (final scene only)
      tl.fromTo("#f18-recap-fade", { opacity: 1 }, { opacity: 0, duration: 2.0, ease: "power1.inOut", immediateRender: false }, 34.7);

      window.__timelines["f18-recap"] = tl;
    })();
  </script>
</template>
