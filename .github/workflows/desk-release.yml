# Reelfold desk release (apps/desk). Push a tag v<version> (must equal apps/desk/package.json "version") and this
# builds the macOS arm64 app on a GitHub macOS runner with apps/desk/scripts/release-mac.sh (the same script as a local
# `npm run release:mac`): lint + unit tests, engine runtime (python + ffmpeg + this checkout's engine), build, sign with
# the Developer ID certificate (temporary keychain), notarize with an App Store Connect API key, staple, verify
# (codesign / spctl / stapler), packaged-app checks. Then it creates or updates a DRAFT GitHub Release for the tag with
# the DMG, the updater zip + blockmap, latest-mac.yml and release notes (apps/desk/scripts/release-notes.sh).
# In parallel the windows job builds and checks the UNSIGNED Windows x64 NSIS installer; once both are done the
# windows-release job attaches Reelfold-<v>-win-x64-setup.exe + .blockmap + latest.yml (the Windows update feed) to the
# same draft. A Windows failure never blocks the macOS files (the mac job does not wait for it); it turns the run red
# and the run summary says "Windows installer NOT attached" (re-run the failed jobs to attach it later).
# It never publishes: the creator reviews the draft and clicks Publish (docs/CI_CD.md says how to change that), which
# makes electron-updater offer it and turns the website's download button on (deploy-web.yml runs on release: published).
#
# Manual runs (Actions -> Desk release -> Run workflow): dry_run (default) does everything except the GitHub Release
# and keeps the files as a workflow artifact; windows also builds the unsigned Windows installer, and the dry run's
# windows-release job checks it and prints what it would upload to which release (without touching any release).
#
# Repository secrets (one-time setup: docs/CI_CD.md); without them the run fails in its first step, before building:
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD                         Developer ID Application certificate + key (.p12)
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID  App Store Connect API key (notarization)
name: Desk release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, sign, notarize and verify, but do not create the draft release'
        type: boolean
        default: true
      windows:
        description: 'Also build the unsigned Windows installer (tag pushes always do; a dry run only prints the upload)'
        type: boolean
        default: false
      mac:
        description: 'Build the macOS app (untick for a Windows-only test build)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    name: macOS arm64 (signed + notarized)
    if: github.event_name != 'workflow_dispatch' || inputs.mac
    runs-on: macos-15 # Apple silicon
    timeout-minutes: 120
    permissions:
      contents: write # create / update the draft release
    env:
      DRY_RUN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      DESK_HIDE_WINDOW: '1'
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    steps:
      - name: Signing + notarization secrets present
        working-directory: .
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=""
          for s in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Release secrets missing::add these repository secrets first (docs/CI_CD.md):$missing. Nothing was built; a release is never built unsigned."
            exit 1
          fi
          echo "all 5 signing / notarization secrets are set"

      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # tags + history for the release notes
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      - name: Version and tag
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || {
              echo "::error title=Version mismatch::tag $GITHUB_REF_NAME but apps/desk/package.json is $v. Bump with: npm run version:bump -- ${GITHUB_REF_NAME#v}"; exit 1; }
          elif [ "$DRY_RUN_RELEASE" != "true" ] && [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "::error::a non-dry manual run must be started on the tag $tag (Use workflow from: Tags -> $tag), so the build matches the tag"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Reelfold $v ($tag), dry run: $DRY_RUN_RELEASE"

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
        working-directory: .
      - name: Cache runtime downloads (python, wheels, conda packages)
        uses: actions/cache@v6
        with:
          path: apps/desk/build/.cache
          key: runtime-darwin-arm64-${{ hashFiles('apps/desk/packaging/runtime.lock.json', 'apps/desk/packaging/requirements/*.txt', 'apps/desk/packaging/ffmpeg/*.txt') }}
          restore-keys: runtime-darwin-arm64-

      - name: Import the Developer ID certificate + API key (temporary keychain)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          kc="$RUNNER_TEMP/reelfold-signing.keychain-db"
          kc_pw=$(openssl rand -base64 24)
          echo "::add-mask::$kc_pw"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "::error::no 'Developer ID Application' identity in MAC_CERT_P12_BASE64 (export the certificate WITH its private key)"; exit 1; }
          echo "signing identity: $identity"
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          { echo "SIGNING_KEYCHAIN=$kc"; echo "CSC_KEYCHAIN=$kc"; echo "MAC_SIGN_IDENTITY=$identity"; echo "APPLE_API_KEY=$key"; } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, verify (scripts/release-mac.sh)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: npm run release:mac

      - name: Collect release files
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          for f in "dist/Reelfold-$VERSION-mac-arm64.dmg" "dist/Reelfold-$VERSION-mac-arm64.zip" \
                   "dist/Reelfold-$VERSION-mac-arm64.zip.blockmap" dist/latest-mac.yml; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            cp "$f" "$out/"
          done
          ls -lh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: reelfold-${{ steps.version.outputs.version }}-mac-arm64
          path: ${{ steps.files.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          { echo "## Release notes ($TAG)"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Create / update the DRAFT GitHub Release
        if: env.DRY_RUN_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; not touching it. Bump the version and tag again."; exit 1
            fi
            gh release upload "$TAG" "$DIR"/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            echo "updated draft $TAG"
          else
            pre=()
            case "$VERSION" in *-*) pre=(--prerelease) ;; esac
            gh release create "$TAG" "$DIR"/* --draft --verify-tag --title "Reelfold $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
            echo "created draft $TAG"
          fi
          url=$(gh release view "$TAG" --json url -q .url)
          echo "### Draft release ready: $url  (review the notes, then Publish)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain and API key
        if: always()
        working-directory: . # apps/desk may not exist (run stopped before checkout)
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"

  # PREVIEW: Windows x64 installer, UNSIGNED (SmartScreen warns). Runs on every tag push and on a manual run with
  # windows: true (untick mac for a Windows-only run). Independent of the mac job, so a failure here never holds back the
  # macOS files; it does turn the run red. Besides building it checks the real thing: the bundled runtime transcribes a
  # real recording (faster-whisper), the unpacked app and the INSTALLED app (silent NSIS install into the runner's
  # profile) pass the packaged-app checks. The windows-release job below attaches the result to the draft release.
  # Signing later: apps/desk/docs/RELEASING.md "Windows".
  windows:
    name: Windows x64 (unsigned preview)
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DESK_HIDE_WINDOW: '1'
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run test:unit
      - name: Cache runtime downloads
        uses: actions/cache@v6
        with:
          path: apps/desk/build/.cache
          key: runtime-win32-x64-${{ hashFiles('apps/desk/packaging/runtime.lock.json', 'apps/desk/packaging/requirements/*.txt', 'apps/desk/packaging/ffmpeg/*.txt') }}
          restore-keys: runtime-win32-x64-
      - name: Engine runtime (python + LGPL ffmpeg + engine; import / encoder / path-length checks)
        timeout-minutes: 45
        run: node scripts/runtime/bundle.mjs --target=win32-x64
      - name: Installer (unsigned NSIS)
        run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: reelfold-win32-x64-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desk/dist/Reelfold-*-win-x64-setup.exe
            apps/desk/dist/Reelfold-*-win-x64-setup.exe.blockmap
            apps/desk/dist/latest.yml
      - name: Packaged checks on the unpacked app (incl. a real transcription)
        env:
          DESK_TEST_ASR: '1'
        run: npx playwright test -c playwright.packaged.config.ts
      - name: Install silently, run the packaged checks on the installed app, uninstall
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'Reelfold-*-win-x64-setup.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList '/S'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Reelfold\Reelfold.exe'
          if (-not (Test-Path $app)) { throw "not installed at $app" }
          "installed: $app"
          $env:DESK_APP_PATH = $app
          npx playwright test -c playwright.packaged.config.ts
          if ($LASTEXITCODE -ne 0) { throw "packaged checks failed on the installed app" }
          $un = Join-Path $env:LOCALAPPDATA 'Programs\Reelfold\Uninstall Reelfold.exe'
          Start-Process -Wait -FilePath $un -ArgumentList '/S'
          if (Test-Path $app) { throw "uninstall left $app" }
          "uninstalled"
      - name: Sizes
        run: |
          ls -l dist/*.exe dist/*.blockmap dist/latest*.yml
          du -sh dist/win-unpacked dist/win-unpacked/resources/runtime
          {
            echo "### Windows x64 (unsigned) installer"
            echo '```'
            ls -l dist/*.exe | awk '{printf "%s  %.0f MB\n", $NF, $5/1048576}'
            du -sh dist/win-unpacked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: windows-packaged-test-results, path: apps/desk/test-results, retention-days: 7 }

  # Attaches the Windows installer to the same DRAFT release as the macOS files: after both jobs (needs:), and tolerant
  # of order anyway (creates the draft if it is missing, e.g. a Windows-only run on the tag). Dry run: verifies the files
  # (names, latest.yml points at the .exe with the right sha512) and prints the upload it would do, without touching any
  # release. Never publishes; never touches a published release.
  windows-release:
    name: Attach Windows installer to the draft release
    needs: [mac, windows]
    if: always() && needs.windows.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload to the draft release
    env:
      DRY_RUN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      WIN_RESULT: ${{ needs.windows.result }}
      MAC_RESULT: ${{ needs.mac.result }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    steps:
      - name: Windows build and macOS job finished?
        id: gate
        working-directory: .
        run: |
          go=true
          if [ "$WIN_RESULT" != "success" ]; then
            echo "::error title=Windows installer NOT attached::the Windows job ended '$WIN_RESULT'. The macOS files are not affected. Fix it and re-run the failed jobs to attach the installer to the draft."
            { echo "### Windows installer NOT attached"; echo "windows job: \`$WIN_RESULT\`, macOS job: \`$MAC_RESULT\`. Re-run the failed jobs to attach it to the draft."; } >> "$GITHUB_STEP_SUMMARY"
            go=false
          elif [ "$MAC_RESULT" = "failure" ] || [ "$MAC_RESULT" = "cancelled" ]; then
            echo "::warning title=Windows installer held back::the macOS job ended '$MAC_RESULT'; not creating a Windows-only draft. Re-run the failed jobs: the Windows installer is attached after the macOS draft exists."
            { echo "### Windows installer held back"; echo "macOS job: \`$MAC_RESULT\`. Re-run the failed jobs."; } >> "$GITHUB_STEP_SUMMARY"
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.go == 'true'
        with: { fetch-depth: 0 } # tags + history for the release notes (only used if this job creates the draft)

      - name: Version and tag
        if: steps.gate.outputs.go == 'true'
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || {
              echo "::error title=Version mismatch::tag $GITHUB_REF_NAME but apps/desk/package.json is $v"; exit 1; }
          elif [ "$DRY_RUN_RELEASE" != "true" ] && [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "::error::a non-dry manual run must be started on the tag $tag"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        if: steps.gate.outputs.go == 'true'
        with:
          name: reelfold-win32-x64-unsigned
          path: ${{ runner.temp }}/win

      - name: Check the Windows files (names, latest.yml -> .exe, sha512)
        if: steps.gate.outputs.go == 'true'
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/win"
          exe="Reelfold-$VERSION-win-x64-setup.exe"
          ls -l "$dir"
          for f in "$exe" "$exe.blockmap" latest.yml; do
            [ -f "$dir/$f" ] || { echo "::error::missing $f in the Windows artifact"; exit 1; }
          done
          for f in "$dir"/*; do
            case "${f##*/}" in "$exe" | "$exe.blockmap" | latest.yml) ;;
              *) echo "::error::unexpected file in the Windows artifact: ${f##*/}"; exit 1 ;; esac
          done
          yml="$dir/latest.yml"
          grep -qx "version: $VERSION" "$yml" || { echo "::error::latest.yml is not version $VERSION"; cat "$yml"; exit 1; }
          grep -qx "path: $exe" "$yml" || { echo "::error::latest.yml path is not $exe"; cat "$yml"; exit 1; }
          sha=$(openssl dgst -sha512 -binary "$dir/$exe" | base64 -w0)
          grep -qx "sha512: $sha" "$yml" || { echo "::error::latest.yml sha512 does not match $exe"; cat "$yml"; exit 1; }
          echo "latest.yml -> $exe, sha512 ok"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Attach to the DRAFT GitHub Release (dry run prints it)
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          files=("$DIR"/*)
          names=$(for f in "${files[@]}"; do printf '%s (%s MB)\n' "${f##*/}" "$(( $(stat -c %s "$f") / 1048576 ))"; done)
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then exists=true; else exists=false; draft=; fi
          if [ "$DRY_RUN_RELEASE" = "true" ]; then
            bash scripts/release-notes.sh "$TAG" > /dev/null # the notes a created draft would get must build
            if [ "$exists" = true ] && [ "$draft" != "true" ]; then
              plan="release $TAG is already PUBLISHED: a real run would stop with an error (bump the version)"
            elif [ "$exists" = true ]; then
              plan="gh release upload $TAG <files> --clobber   (draft $TAG exists)"
            else
              plan="gh release create $TAG <files> --draft --verify-tag --title \"Reelfold $VERSION\" --notes-file <notes>   (no release $TAG visible yet; on a tag run the mac job creates it first and this becomes an upload)"
            fi
            echo "DRY RUN: nothing uploaded. Would run: $plan"
            printf '%s\n' "$names"
            { echo "### Windows installer (dry run, nothing uploaded)"; echo "Would run: \`$plan\`"; echo '```'; printf '%s\n' "$names"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$exists" = true ]; then
            [ "$draft" = "true" ] || { echo "::error::release $TAG is already published; not touching it."; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
            echo "attached to draft $TAG"
          else
            bash scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
            pre=()
            case "$VERSION" in *-*) pre=(--prerelease) ;; esac
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Reelfold $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}" \
              || gh release upload "$TAG" "${files[@]}" --clobber # created meanwhile by the mac job
            echo "created draft $TAG with the Windows installer"
          fi
          url=$(gh release view "$TAG" --json url -q .url)
          { echo "### Windows installer (unsigned preview) attached: $url"; echo '```'; printf '%s\n' "$names"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
