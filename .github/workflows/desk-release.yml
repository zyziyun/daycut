# Reelfold release (apps/desk): on a tag v<version> (must equal apps/desk/package.json "version"), build the engine
# runtime (python + ffmpeg + this repo's own lib/ and workflows/, nothing fetched from git) + installers for
# macOS arm64, macOS x64 (best effort) and Windows x64, sign/notarize when the secrets exist (unsigned otherwise),
# run the packaged-app check, upload artifacts, and attach everything to a DRAFT GitHub Release on this repository
# (zyziyun/reelfold; repo variables DESK_RELEASES_OWNER / DESK_RELEASES_REPO override), which electron-updater and the
# website's download link read. Publish the draft by hand. The Windows job is built too (experimental for now).
#
# Secrets (see docs/RELEASING.md). Test builds (workflow_dispatch without "publish") work without any and are unsigned;
# a tag / publish run FAILS at "Signing setup" when the signing or notarization secrets are missing.
# Local alternative (Developer ID in the login keychain + notarytool profile): npm run release:mac
#   mac signing   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD
#   notarization  APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   win signing   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#                 AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#                 or WIN_CERT_PFX_BASE64, WIN_CERT_PASSWORD
#   publishing    the workflow's own GITHUB_TOKEN (contents: write); RELEASES_TOKEN only if the releases live elsewhere
name: Desk release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach to a draft GitHub Release on this repo'
        type: boolean
        default: false
permissions:
  contents: write # electron-builder creates / fills the draft release on this repo
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, eb: '--mac --arm64', experimental: false }
          - { os: macos-15-intel, target: darwin-x64, eb: '--mac --x64 -c.mac.minimumSystemVersion=12.0', experimental: true }
          # v0.2 ships macOS only (About / Settings say so); Windows is built as a preview and never blocks the release
          - { os: windows-latest, target: win32-x64, eb: '--win nsis --x64', experimental: true }
    env:
      DESK_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")   # apps/desk/package.json
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }

      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run test:unit

      - name: Cache runtime downloads (python, wheels, conda packages)
        uses: actions/cache@v4
        with:
          path: apps/desk/build/.cache
          key: runtime-${{ matrix.target }}-${{ hashFiles('apps/desk/packaging/runtime.lock.json', 'apps/desk/packaging/requirements/*.txt', 'apps/desk/packaging/ffmpeg/*.txt') }}
          restore-keys: runtime-${{ matrix.target }}-

      - name: Build engine runtime
        run: node scripts/runtime/bundle.mjs --target=${{ matrix.target }}

      - name: Signing setup
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CERT_P12_BASE64" ]; then
              { echo "CSC_LINK=$MAC_CERT_P12_BASE64"; echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"; } >> "$GITHUB_ENV"
              echo "macOS: signing with the Developer ID certificate"
              [ -n "$APPLE_ID" ] && echo "macOS: notarizing" || echo "::warning::APPLE_ID not set: signed but NOT notarized"
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "::warning::MAC_CERT_P12_BASE64 not set: building an UNSIGNED macOS app"
            fi
          else
            if [ -n "$AZURE_CLIENT_ID" ]; then echo "Windows: Azure Trusted Signing"
            elif [ -n "$WIN_CERT_PFX_BASE64" ]; then
              { echo "WIN_CSC_LINK=$WIN_CERT_PFX_BASE64"; echo "WIN_CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD"; } >> "$GITHUB_ENV"
              echo "Windows: signing with the PFX"
            else echo "::warning::no Windows signing secrets: building an UNSIGNED installer"; fi
          fi
          publish=never
          wants=false
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] || [ "${{ inputs.publish }}" = "true" ]; then wants=true; fi
          if [ "$wants" = "true" ]; then
            # a release is never published unsigned / un-notarized: stop here with the missing secret's name
            missing=""
            if [ "$RUNNER_OS" = "macOS" ]; then
              [ -n "$MAC_CERT_P12_BASE64" ] || missing="$missing MAC_CERT_P12_BASE64"
              [ -n "$MAC_CERT_PASSWORD" ] || missing="$missing MAC_CERT_PASSWORD"
              [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID(+APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)"
            elif [ -z "$AZURE_CLIENT_ID" ] && [ -z "$WIN_CERT_PFX_BASE64" ]; then
              missing="$missing AZURE_*|WIN_CERT_PFX_BASE64"
            fi
            if [ -n "$missing" ]; then
              echo "::error title=Release not signed::publishing needs these repository secrets:$missing (docs/RELEASING.md). Or build and notarize locally: npm run release:mac"
              exit 1
            fi
            publish=always
          fi
          echo "EB_PUBLISH=$publish" >> "$GITHUB_ENV"
          echo "publish: $publish"

      - name: Build installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          DESK_RELEASES_OWNER: ${{ vars.DESK_RELEASES_OWNER }}
          DESK_RELEASES_REPO: ${{ vars.DESK_RELEASES_REPO }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          npm run build
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.eb }} --publish "$EB_PUBLISH"

      - name: Verify signature / notarization (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d dist/mac*/*.app | head -1)
          if [ "$EB_PUBLISH" = "always" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t exec "$app"
            xcrun stapler validate "$app"
          else
            codesign --verify --deep --strict --verbose=2 "$app" || echo "::warning::app is not (validly) signed"
            spctl -a -vvv -t exec "$app" || echo "::warning::Gatekeeper would reject this build (unsigned or not notarized)"
          fi

      - name: Packaged app check (bundled engine, mock + real health)
        shell: bash
        run: npx playwright test -c playwright.packaged.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: reelfold-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desk/dist/*.dmg
            apps/desk/dist/*.zip
            apps/desk/dist/*.exe
            apps/desk/dist/*.blockmap
            apps/desk/dist/latest*.yml
