# Lint, typecheck, unit + engine tests and the Electron smoke test on every PR and push to master.
name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:engine
      - name: Electron smoke test (mock engine)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-results, path: test-results, retention-days: 7 }
