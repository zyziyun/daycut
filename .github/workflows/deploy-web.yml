# Website + docs (apps/site + apps/docs) -> reelfold.com, the Cloudflare Worker "reelfold-site" (apps/site/wrangler.jsonc).
#   pull_request              build + checks only, never deploys
#   push to main              build + checks, then deploy (only when the checks pass), then smoke-test the live site
#   release: published        same as a push to main (rebuilds from main), so the site's download buttons turn on as
#                             soon as a desk release is published (apps/site/src/lib/releaseStatus.ts)
#   workflow_dispatch         manual redeploy (main only)
# Needs repository secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (docs/CI_CD.md). Without them the deploy job
# is skipped with a warning; the build and checks still run.
name: Deploy web
on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'apps/docs/**'
      - 'scripts/build-web.sh'
      - 'lib/vstudio/platform.py'
      - 'references/**'
      - 'workflows/*/WORKFLOW.md'
      - 'persona.example.yaml'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'apps/docs/**'
      - 'scripts/build-web.sh'
      - 'lib/vstudio/platform.py'
      - 'references/**'
      - 'workflows/*/WORKFLOW.md'
      - 'persona.example.yaml'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # one production deploy at a time (queued, never cancelled half-way); PR runs cancel their older runs
  group: deploy-web-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build + check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # a release event points at the tag; the site is always deployed from main
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt }

      - name: check_skill (personal paths / secrets)
        run: python scripts/check_skill.py

      - name: Python deps for the docs reference generator (engine minus ASR / mediapipe)
        run: |
          grep -vE '^(mediapipe|mlx-whisper|faster-whisper)' requirements.txt \
            | sed 's/^opencv-python$/opencv-python-headless/' > "$RUNNER_TEMP/docs-req.txt"
          python -m pip install -q -r "$RUNNER_TEMP/docs-req.txt"
      - name: Regenerate the docs reference pages from the engine sources
        run: |
          python apps/docs/scripts/gen_reference.py
          # a missing dependency shows up as a traceback inside cli.md: fail instead of publishing it
          if grep -rlE 'Traceback \(most recent call last\)|ModuleNotFoundError' apps/docs/src/content/docs/reference; then
            echo "::error::gen_reference.py wrote a traceback into the docs (missing Python dependency?)"; exit 1
          fi
          git diff --stat -- apps/docs/src/content/docs/reference || true

      - run: npm ci --ignore-scripts
      - name: Build site + docs (scripts/build-web.sh)
        env:
          GITHUB_TOKEN: ${{ github.token }} # releaseStatus.ts: is a desk release published? (download buttons)
        run: scripts/build-web.sh
      - name: Site checks (copy rules, SEO, links, privacy)
        run: npm run check -w apps/site
      - name: Docs internal links
        run: npm run check:links -w apps/docs

      - uses: actions/upload-artifact@v7
        with: { name: web-dist, path: apps/site/dist, retention-days: 3, if-no-files-found: error }

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://reelfold.com
    steps:
      - name: Cloudflare secrets present?
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy skipped::missing repository secrets:$missing (one-time setup in docs/CI_CD.md). The site was built and checked but NOT deployed."
            echo "### Deploy skipped: missing secrets$missing (see docs/CI_CD.md)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          sparse-checkout: apps/site/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        if: steps.secrets.outputs.ready == 'true'
        with: { name: web-dist, path: apps/site/dist }
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with: { node-version: 22 }
      - name: wrangler deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy

      - name: Smoke test reelfold.com
        if: steps.secrets.outputs.ready == 'true'
        run: |
          check() { # path, text that must be in <title>
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -L -o page.html -w '%{http_code}' "https://reelfold.com$1" || echo 000)
              title=$(grep -o '<title>[^<]*</title>' page.html 2>/dev/null | head -1)
              if [ "$code" = "200" ] && printf '%s' "$title" | grep -qF "$2"; then echo "ok  $1  $title"; return 0; fi
              echo "try $i: $1 -> HTTP $code, ${title:-no <title>}"; sleep 10
            done
            echo "::error title=Smoke test failed::https://reelfold.com$1 (HTTP $code, expected a <title> with \"$2\")"; return 1
          }
          fail=0
          check / 'Reelfold' || fail=1
          check /zh/ '千剪' || fail=1
          check /docs/ 'Reelfold Docs' || fail=1
          exit $fail
