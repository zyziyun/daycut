# Reelfold desk app (apps/desk): lint + typecheck, unit tests, sidecar engine tests (against this repo's engine) and
# the Electron e2e suite (hidden windows) on macOS. The windows job runs the same checks plus the engine's pytest on
# windows-latest; a failure there fails the run like one on macOS.
name: Desk CI
on:
  pull_request:
    paths:
      - 'apps/desk/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desk-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desk/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desk-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desk
    env:
      DESK_HIDE_WINDOW: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - name: Engine deps for the sidecar's real-engine tests (no local ASR models)
        working-directory: .
        run: |
          grep -v whisper requirements.txt > "$RUNNER_TEMP/req.txt"
          python -m pip install -r "$RUNNER_TEMP/req.txt"
          python -c "import yaml, numpy"   # fail here, not deep inside an e2e test
          brew install ffmpeg
          # the app would otherwise pick the runner's Homebrew python3 (no engine deps) before this one
          echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: .
      - name: check_skill (personal paths / secrets in apps/)
        working-directory: .
        run: python scripts/check_skill.py
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:engine
      - run: npm run test:scripts # App Store lint + runtime patch (scripts/appstore, scripts/runtime)
      - name: Electron e2e (hidden windows, mock + real engine)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: desk-test-results, path: apps/desk/test-results, retention-days: 7 }

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    env:
      DESK_HIDE_WINDOW: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - name: Engine deps + ffmpeg
        working-directory: .
        run: |
          python -m pip install -r tests/requirements.txt
          python -c "import yaml, numpy, cv2, mediapipe, faster_whisper; print('deps ok')"
          # the Chocolatey download fails now and then: retry, and show why when it does
          for i in 1 2 3; do
            choco install ffmpeg -y --no-progress > "$RUNNER_TEMP/choco.log" 2>&1 && break
            tail -20 "$RUNNER_TEMP/choco.log"; sleep 30
          done
          ffmpeg -hide_banner -version | head -1
          echo "DESK_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: .
      - run: npm run lint
      # every check below runs even after a failure, so one run shows all Windows failures
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      - name: Electron binary (downloaded up front, not lazily inside the first test)
        if: success() || failure()
        working-directory: .
        run: node node_modules/electron/install.js && node -e "console.log(require('electron'))"
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: App start check (main log)
        if: success() || failure()
        run: node scripts/startCheck.mjs 45
      - name: Sidecar engine tests
        if: success() || failure()
        run: python -m unittest discover -s engine/tests
      - name: Engine pytest
        if: success() || failure()
        working-directory: .
        run: python -m pytest -q -p no:cacheprovider
      - name: Electron e2e (hidden windows, mock + real engine)
        if: success() || failure()
        # like the macOS job (no local ASR models): faster-whisper is installed here for the pytest above, and would
        # download a Whisper model inside an e2e run
        env: { HF_HUB_OFFLINE: '1' }
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: desk-test-results-windows, path: apps/desk/test-results, retention-days: 7 }
