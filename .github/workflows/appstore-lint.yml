# App Store lint for the Mac App Store ("Lite") build of the desk app (apps/desk/scripts/appstore/appstore_lint.py,
# docs: apps/desk/docs/MAS.md "App Store lint"). On every PR / push that can change what ships in the app it builds
# the darwin-arm64 engine runtime and an UNSIGNED `--mac mas` app with BUILD_EDITION=mas (no secrets) and fails on what
# App Review rejected or is known to reject:
#   - Tcl/Tk and non-public Accelerate BLAS/LAPACK symbols in any Mach-O (Guideline 2.5.1; Reelfold 0.2.1 was rejected
#     for CPython's _tkinter and scipy's SuperLU), Electron's private QuartzCore classes;
#   - "itms-services" in bundled Python files;
#   - the MAS entitlement files: app-sandbox everywhere, children exactly app-sandbox + inherit, no network.server
#     (Guideline 2.4.5), nothing outside the allow-list;
#   - quarantine flags.
# Signatures and per-architecture entitlements of the signed build are checked by scripts/release-mas.sh (same lint).
#
# Optional, manual (Actions -> App Store lint -> Run workflow, "validate"): build, sign and `xcrun altool
# --validate-app` the store .pkg with scripts/release-mas.sh. Runs only when these repository secrets exist (else the
# job says so and stops; nothing else depends on it):
#   MAS_CERTS_P12_BASE64, MAS_CERTS_PASSWORD   Apple Distribution + Mac Installer Distribution certificates with keys
#   MAS_PROVISIONING_PROFILE_BASE64            the "Mac App Store Connect" profile for app.reelfold.desk
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID   App Store Connect API key (as in desk-release.yml)
# It never uploads.
name: App Store lint
on:
  pull_request:
    paths:
      - 'apps/desk/**'
      - 'lib/**'
      - 'workflows/**'
      - 'requirements.txt'
      - '.github/workflows/appstore-lint.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desk/**'
      - 'lib/**'
      - 'workflows/**'
      - 'requirements.txt'
      - '.github/workflows/appstore-lint.yml'
  workflow_dispatch:
    inputs:
      validate:
        description: 'Also sign the store .pkg and validate it with App Store Connect (needs the MAS secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: appstore-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Mac App Store build (unsigned) - App Store lint
    runs-on: macos-15 # Apple silicon: the runtime is built by its own interpreter
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
        working-directory: .
      - name: Lint unit tests
        run: python3 -m unittest discover -s scripts/appstore
      - name: Cache runtime downloads (python, wheels, conda packages)
        uses: actions/cache@v6
        with:
          path: apps/desk/build/.cache
          key: runtime-darwin-arm64-${{ hashFiles('apps/desk/packaging/runtime.lock.json', 'apps/desk/packaging/requirements/*.txt', 'apps/desk/packaging/ffmpeg/*.txt') }}
          restore-keys: runtime-darwin-arm64-
      - name: Engine runtime (its verify step lints the runtime's symbols and strings)
        run: node scripts/runtime/bundle.mjs --target=darwin-arm64
      - name: App (BUILD_EDITION=mas), unsigned mas package
        run: |
          BUILD_EDITION=mas npm run build
          # electron-builder stops at the signing step without an Apple Distribution identity; the .app is complete then
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --config electron-builder.config.cjs --mac mas --arm64 --publish never -c.mas.identity=null || true
          test -d dist/mas-arm64/Reelfold.app
      - name: App Store lint (symbols, strings, entitlement files, quarantine)
        run: python3 scripts/appstore/appstore_lint.py dist/mas-arm64/Reelfold.app --unsigned

  validate:
    name: Signed store pkg - altool --validate-app (manual, optional)
    if: github.event_name == 'workflow_dispatch' && inputs.validate
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/desk
    env:
      MAS_CERTS_P12_BASE64: ${{ secrets.MAS_CERTS_P12_BASE64 }}
      MAS_CERTS_PASSWORD: ${{ secrets.MAS_CERTS_PASSWORD }}
      MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: MAS secrets present
        id: secrets
        working-directory: .
        run: |
          for s in MAS_CERTS_P12_BASE64 MAS_CERTS_PASSWORD MAS_PROVISIONING_PROFILE_BASE64 APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!s}" ]; then
              echo "::notice title=App Store validation skipped::repository secret for $s is not set (see the header of .github/workflows/appstore-lint.yml)"
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'
        working-directory: .
      - name: Cache runtime downloads
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v6
        with:
          path: apps/desk/build/.cache
          key: runtime-darwin-arm64-${{ hashFiles('apps/desk/packaging/runtime.lock.json', 'apps/desk/packaging/requirements/*.txt', 'apps/desk/packaging/ffmpeg/*.txt') }}
          restore-keys: runtime-darwin-arm64-
      - name: Certificates, profile and API key (temporary keychain)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          kc="$RUNNER_TEMP/reelfold-mas.keychain-db"
          kc_pw=$(openssl rand -base64 24)
          echo "::add-mask::$kc_pw"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$MAS_CERTS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$kc" -P "$MAS_CERTS_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/mas.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > packaging/mac/Reelfold_Mac_App_Store.provisionprofile
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build, sign, App Store lint, validate (no upload)
        if: steps.secrets.outputs.ok == 'true'
        run: SKIP_TESTS=1 bash scripts/release-mas.sh
